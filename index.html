      if(!s.empty) return;
      var b = db.batch();
      DEPTS.forEach(function(n,i){ b.set(db.collection("departments").doc("d"+(i+1)), {name:n, order:i+1, createdAt:new Date().toISOString()}); });
      return db.collection("employees").limit(1).get().then(function(e){
        if(e.empty) b.set(db.collection("employees").doc("e_hr_admin"), {firstName:"ທ.ຈັນທະວີ", lastName:"ສີລິພອນ", department:"d1", departmentName:DEPTS[0], position:"ຜູ້ຈັດການ", role:"admin", quotaAnnual:0, createdAt:new Date().toISOString()});
        return b.commit();
      });
    });
  }
  function getDb(){
    if(dbRef) return Promise.resolve(dbRef);
    if(!OK) return Promise.resolve(null);
    try{
      firebase.initializeApp(cfg);
      var db = firebase.firestore();
      /* keep a local copy on the phone: reopening reads only what changed (saves the free daily read quota) */
      var pers = (typeof db.enablePersistence==="function") ? db.enablePersistence({synchronizeTabs:true}).catch(function(){}) : Promise.resolve();
      return pers.then(function(){ return seedIfEmpty(db); }).then(function(){ dbRef=db; return db; }, function(){ dbRef=db; return db; });
    }catch(e){ return Promise.resolve(null); }
  }
  var downloads = { save:function(x){
    return new Promise(function(res,rej){
      try{
        var blob = new Blob([x.data], {type:(/\.xlsx$/i.test(x.filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"text/csv;charset=utf-8")});
        if(window.navigator.msSaveBlob){ window.navigator.msSaveBlob(blob, x.filename); res({status:"saved"}); return; }
        var url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href=url; a.download=x.filename; a.style.display="none"; document.body.appendChild(a); a.click();
        setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
        res({status:"saved"});
      }catch(e){ rej({code:"unavailable"}); }
    });
  }};
  window.claude = { use:function(n){ if(n==="db") return getDb(); if(n==="downloads") return Promise.resolve(downloads); return Promise.resolve(null); } };
})();
</script>
<title>ຂະໜົມລາວ ລາພັກ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Lao:wght@500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ===== Tokens =====
   Layout: glass cards floating over a live "neural network" field; 3D app-icon tiles as the navigation language */
:root{
  --bg:#E6F1FF; --surface:#FFFFFF; --surface-2:#EAF0EB; --surface-3:#DCE6DE;
  --glass:rgba(255,255,255,.74); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.9); --glass-edge:rgba(30,80,60,.10);
  --ink:#14241B; --ink-dim:#506256; --ink-faint:#83958A; --line:#D5E0D8;
  --accent:#16705A; --accent-ink:#FFFFFF; --accent-soft:#D9EEE6;
  --gold:#BF8426; --gold-soft:#F3E4C8;
  --good:#23855A; --good-soft:#D9F0E2;
  --warn:#B7791F; --warn-soft:#F6EAD3;
  --bad:#B33F35; --bad-soft:#F8DDD9;
  --info:#2F67B0; --info-soft:#DDE8F7;
  --aura-1:rgba(40,190,150,.30); --aura-2:rgba(80,170,230,.22); --aura-3:rgba(240,190,90,.22);
  --grid-dot:rgba(42,120,220,.10); --net-line:60,120,230; --net-alpha:.16;
  --shadow:0 1px 2px rgba(20,40,25,.05), 0 10px 30px -8px rgba(20,60,40,.16);
  --font-display:'Noto Serif Lao','Noto Serif',serif;
  --font-body:'Noto Sans Lao','Noto Sans',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1310; --surface:#14201B; --surface-2:#1A2822; --surface-3:#24352D;
    --glass:rgba(18,30,25,.70); --glass-strong:rgba(18,30,25,.84); --glass-strong:rgba(18,30,25,.84); --glass-line:rgba(140,230,200,.10); --glass-edge:rgba(0,0,0,.35);
    --ink:#E6F2EC; --ink-dim:#A3B8AD; --ink-faint:#6E8578; --line:#2A3B33;
    --accent:#45C4A0; --accent-ink:#06120D; --accent-soft:#163A30;
    --gold:#E7B358; --gold-soft:#3A2E17;
    --good:#55C08C; --good-soft:#153325;
    --warn:#E7B358; --warn-soft:#3A2E17;
    --bad:#EE8579; --bad-soft:#3D1F1C;
    --info:#7FAAE6; --info-soft:#18283E;
    --aura-1:rgba(30,200,150,.20); --aura-2:rgba(60,130,220,.16); --aura-3:rgba(230,170,70,.10);
    --grid-dot:rgba(120,160,255,.08); --net-line:120,160,255; --net-alpha:.20;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px -10px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1310; --surface:#14201B; --surface-2:#1A2822; --surface-3:#24352D;
  --glass:rgba(18,30,25,.70); --glass-strong:rgba(18,30,25,.84); --glass-line:rgba(140,230,200,.10); --glass-edge:rgba(0,0,0,.35);
  --ink:#E6F2EC; --ink-dim:#A3B8AD; --ink-faint:#6E8578; --line:#2A3B33;
  --accent:#45C4A0; --accent-ink:#06120D; --accent-soft:#163A30;
  --gold:#E7B358; --gold-soft:#3A2E17;
  --good:#55C08C; --good-soft:#153325;
  --warn:#E7B358; --warn-soft:#3A2E17;
  --bad:#EE8579; --bad-soft:#3D1F1C;
  --info:#7FAAE6; --info-soft:#18283E;
  --aura-1:rgba(30,200,150,.20); --aura-2:rgba(60,130,220,.16); --aura-3:rgba(230,170,70,.10);
  --grid-dot:rgba(120,160,255,.08); --net-line:120,160,255; --net-alpha:.20;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px -10px rgba(0,0,0,.6);

}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  padding-left:max(16px, env(safe-area-inset-left,0px));

}
h1,h2,h3,.disp{font-family:var(--font-display); text-wrap:balance; font-weight:700; margin:0}

a{color:var(--accent)}
button{font-family:inherit; font-size:inherit}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
/* 16px stops iPhone from zooming in when a field is tapped */
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:9px 11px; width:100%; min-width:0; max-width:100%; min-height:44px}
textarea{min-height:88px; resize:vertical}
input[type="date"]{-webkit-appearance:none; appearance:none; display:block; line-height:1.4; text-align:left}

button,a,.cal-day{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
label{display:block; font-size:12.5px; color:var(--ink-dim); margin:0 0 5px; font-weight:600}
.field{margin-bottom:13px}
.wrap{max-width:1180px; margin:0 auto}
.row{display:flex; gap:10px; flex-wrap:wrap}
.col{flex:1; min-width:0}
.grid{display:grid; gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}

@media (max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
/* date pairs stay side by side on phones */
.grid-2k{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:340px){.grid-2k{grid-template-columns:1fr}}

/* ===== Login ===== */
.login-shell{min-height:70vh; display:flex; align-items:center; justify-content:center}
.login-card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:30px 26px; box-shadow:var(--shadow)}
.brand-mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:14px}
.login-card h1{font-size:22px; margin-bottom:4px}
.login-sub{color:var(--ink-dim); font-size:13px; margin-bottom:22px}

/* ===== Shell / header ===== */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
.brand .title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.2}
.brand .sub{font-size:11.5px;color:var(--ink-dim)}
.user-chip{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 14px; box-shadow:var(--shadow)}
.user-chip .who{text-align:right; line-height:1.25}
.user-chip .name{font-weight:700; font-size:13px}
.user-chip .role{font-size:11px; color:var(--ink-dim)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.bell{position:relative; width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell .dot{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--font-mono);font-weight:600}

/* tabs scroll sideways inside their own strip on phones instead of piling up in rows */
.tabs{display:flex; gap:4px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; white-space:nowrap; border:none;background:transparent;padding:10px 14px;min-height:44px;border-radius:10px 10px 0 0;color:var(--ink-dim);cursor:pointer;font-weight:600;font-size:14px;position:relative;border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom:2px solid var(--accent);background:var(--surface-2)}
.tab .count{display:inline-block;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;font-family:var(--font-mono)}

/* ===== Cards / common ===== */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:var(--shadow)}
.card h3{font-size:15px; margin-bottom:12px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint); font-size:12px}
.stat{display:flex; flex-direction:column; gap:4px}
.stat .num{font-family:var(--font-mono); font-size:30px; font-weight:600; line-height:1}
.stat .lbl{font-size:12.5px; color:var(--ink-dim)}
.hr{height:1px;background:var(--line);margin:14px 0;border:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{background:var(--bad-soft); color:var(--bad); border-color:var(--bad-soft)}
.btn-ghost{background:transparent;border-color:transparent;padding:9px 10px}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:8px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-block{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.pill-head{background:var(--warn-soft); color:var(--warn)}
.pill-hr{background:var(--info-soft); color:var(--info)}
.pill-ok{background:var(--good-soft); color:var(--good)}
.pill-no{background:var(--bad-soft); color:var(--bad)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-clash{background:var(--bad-soft);color:var(--bad);border-radius:7px;font-size:11px;font-weight:700;padding:2px 7px}

table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:10px; border-bottom:1px solid var(--line); vertical-align:top}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.wide{min-width:640px}
table.wide th:first-child, table.wide td:first-child{position:sticky; left:0; background:var(--surface); z-index:1}
.empty{padding:36px 14px; text-align:center; color:var(--ink-dim)}
.empty .big{font-size:30px; margin-bottom:8px}

.modal-backdrop{position:fixed; inset:0; background:rgba(10,15,10,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:0}
@media (min-width:640px){.modal-backdrop{align-items:center}}
.modal{background:var(--surface); border-radius:18px 18px 0 0; max-width:540px; width:100%; max-height:88vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow)}
@media (min-width:640px){.modal{border-radius:18px; margin:20px}}
.modal h3{margin-bottom:14px}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}

.bar-track{flex:1;height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent)}
.bar-val{width:92px;flex:none;text-align:right;font-family:var(--font-mono);font-size:12.5px}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.cal-dow{font-size:11px;color:var(--ink-faint);text-align:center;padding-bottom:4px;font-weight:700}
.cal-day{min-height:62px; border:1px solid var(--line); border-radius:9px; padding:5px; background:var(--surface-2); cursor:pointer; display:flex; flex-direction:column; gap:3px}
.cal-day.today{border-color:var(--accent); border-width:2px}
.cal-day.empty{background:transparent; border-color:transparent; cursor:default}
.cal-day .d{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim)}
.cal-chip{font-size:10px; background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:1px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cal-chip.pending{background:var(--warn-soft); color:var(--warn)}
.cal-more{font-size:9.5px; color:var(--ink-faint)}

.badge-role{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; background:var(--surface-3); color:var(--ink-dim)}
.conflict-box{background:var(--bad-soft); border:1px solid var(--bad); color:var(--bad); border-radius:10px; padding:11px 13px; font-size:12.5px; margin-bottom:12px}
.hint{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:10px 0}
.checkline input{width:auto;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast-bad{background:var(--bad);color:#fff}
.dept-group{margin-bottom:12px}
.dept-group h4{font-family:var(--font-display);font-size:13.5px;margin:0 0 6px;display:flex;justify-content:space-between}
.unlock-box{background:var(--warn-soft);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:11px 13px;font-size:12.5px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.modal{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch}
/* finger-sized targets on touch screens */
.btn{min-height:44px}
.btn-sm{min-height:40px; padding:8px 12px}
.bell{width:42px;height:42px;color:var(--ink)}
/* ---- phone layout ---- */
@media (max-width:600px){
  body{font-size:15px}
  .card{padding:15px; border-radius:14px}
  .stat .num{font-size:26px}
  .topbar{gap:10px}
  .topbar > div:last-child{width:100%; justify-content:space-between}
  .user-chip{flex:1; min-width:0; justify-content:flex-end}
  .user-chip .who{min-width:0}
  .user-chip .name,.user-chip .role{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar-row{flex-wrap:wrap; gap:4px 10px}
  .bar-label{width:100%; white-space:normal}
  .bar-val{width:auto}
  .list-row{flex-wrap:wrap}
  .list-row > span{min-width:0}
  .cal-day{min-height:54px; padding:3px}
  .cal-chip{font-size:9px; padding:1px 2px}
  /* tables become stacked cards */
  table.rtable thead{display:none}
  table.rtable, table.rtable tbody, table.rtable tr, table.rtable td{display:block; width:100%}
  table.rtable tr{border:1px solid var(--line); border-radius:12px; padding:6px 12px; margin-bottom:10px; background:var(--surface)}
  table.rtable td{border:none; padding:7px 0; display:flex; justify-content:space-between; gap:12px; text-align:right; max-width:none!important}
  table.rtable td::before{content:attr(data-label); color:var(--ink-faint); font-size:11.5px; font-weight:700; text-align:left; flex:none; max-width:42%}
  table.rtable td[data-label=""]::before{display:none}
  table.rtable td > .tdv{min-width:0; overflow-wrap:anywhere}
  table.rtable td .row{justify-content:flex-end}
  table.rtable td[colspan]{display:block; text-align:center}
  table.rtable td[colspan]::before{display:none}
}

/* ===== AI background: aurora light + dot grid + neural canvas ===== */
.bg-field{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:var(--bg)}
.bg-field::before{content:""; position:absolute; inset:-20%;
  background:
    radial-gradient(40% 35% at 15% 10%, var(--aura-1), transparent 70%),
    radial-gradient(38% 32% at 90% 20%, var(--aura-2), transparent 70%),
    radial-gradient(45% 40% at 70% 95%, var(--aura-3), transparent 70%),
    radial-gradient(35% 30% at 5% 85%, var(--aura-2), transparent 70%);
  animation:auroraDrift 26s ease-in-out infinite alternate}
.bg-field::after{content:""; position:absolute; inset:0;
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1.4px); background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.35));
  mask-image:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.35))}
#netCanvas{position:absolute; inset:0; width:100%; height:100%}
@keyframes auroraDrift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3%,-2%,0) scale(1.06)}100%{transform:translate3d(-3%,2%,0) scale(1.02)}}
#app{position:relative; z-index:1}

/* ===== Glass surfaces ===== */
.card,.login-card,.user-chip,.tabs-shell{
  background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(150%); backdrop-filter:blur(16px) saturate(150%);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow), inset 0 0 0 1px var(--glass-edge);
}
.modal{background:var(--surface)}
.card .card, table.rtable tr{background:var(--surface)}

/* ===== 3D app-icon tiles (iOS launcher look) ===== */
.ico3d{--c1:#5BD08C; --c2:#1E8E5A; --glow:rgba(30,142,90,.45);
  position:relative; flex:none; display:inline-flex; align-items:center; justify-content:center;
  width:var(--s,44px); height:var(--s,44px); border-radius:calc(var(--s,44px) * .27);
  background:linear-gradient(165deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.55),
    inset 0 -2px 4px rgba(0,0,0,.22),
    0 calc(var(--s,44px) * .12) calc(var(--s,44px) * .28) calc(var(--s,44px) * -.06) var(--glow),
    0 1px 2px rgba(0,0,0,.18);
  color:#fff; overflow:hidden; isolation:isolate}
.ico3d::before{content:""; position:absolute; left:6%; right:6%; top:3%; height:48%; border-radius:inherit;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)); z-index:-1}
.ico3d::after{content:""; position:absolute; inset:0; border-radius:inherit;
  background:radial-gradient(120% 80% at 50% 120%, rgba(0,0,0,.18), transparent 60%); z-index:-1}
.ico3d svg{width:58%; height:58%; filter:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.28))}
.ico3d.t-home{--c1:#7C8CA6; --c2:#3E4A60; --glow:rgba(62,74,96,.45)}
.ico3d.t-request{--c1:#4FE09A; --c2:#0E9E62; --glow:rgba(14,158,98,.45)}
.ico3d.t-mine{--c1:#FFB259; --c2:#F0751F; --glow:rgba(240,117,31,.45)}
.ico3d.t-daily{--c1:#5BB8FF; --c2:#1C6FE0; --glow:rgba(28,111,224,.45)}
.ico3d.t-head{--c1:#3FE0C8; --c2:#0B8F86; --glow:rgba(11,143,134,.45)}
.ico3d.t-hr{--c1:#9C8BFF; --c2:#5A3FD6; --glow:rgba(90,63,214,.45)}
.ico3d.t-employees{--c1:#FF7E9D; --c2:#E0315C; --glow:rgba(224,49,92,.42)}
.ico3d.t-reports{--c1:#FFD25A; --c2:#E59A0B; --glow:rgba(229,154,11,.45)}
.ico3d.t-brand{--c1:#2FD3A2; --c2:#0C6E55; --glow:rgba(12,110,85,.5)}
.ico3d.t-bell{--c1:#FF8A7A; --c2:#E0453A; --glow:rgba(224,69,58,.4)}

/* launcher grid on the home screen */
.launcher{display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:18px 10px; padding:18px 14px}
.app-btn{display:flex; flex-direction:column; align-items:center; gap:8px; background:none; border:none; cursor:pointer; color:var(--ink); padding:4px 0; position:relative; border-radius:16px}
.app-btn .ico3d{--s:60px; transition:transform .18s ease}
.app-btn:active .ico3d{transform:scale(.92)}
.app-btn:hover .ico3d{transform:translateY(-2px)}
.app-btn .app-name{font-size:12.5px; font-weight:600; text-align:center; line-height:1.3; max-width:92px}
.app-badge{position:absolute; top:-4px; left:calc(50% + 18px); min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#FF3B30; color:#fff; font-size:12px; font-weight:700; font-family:var(--font-mono); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(255,59,48,.45); border:2px solid var(--bg)}

/* tabs with icons */
.tabs-shell{border-radius:16px; padding:6px; margin-bottom:18px}
.tabs-shell .tabs{border-bottom:none; margin:0; gap:4px}
.tab{display:inline-flex; align-items:center; gap:8px; border-radius:12px !important; border-bottom:none !important; padding:6px 12px 6px 6px}
.tab .ico3d{--s:30px}
.tab.active{background:var(--surface); color:var(--ink); box-shadow:0 2px 10px -3px rgba(0,0,0,.18)}
.tab .count{margin-left:2px}

.brand .ico3d{--s:42px}
.brand .ico3d span{font-family:var(--font-display); font-weight:700; font-size:20px; text-shadow:0 1px 2px rgba(0,0,0,.3)}
.login-card .ico3d{--s:64px; margin-bottom:16px}
.login-card .ico3d span{font-family:var(--font-display); font-weight:700; font-size:30px; text-shadow:0 1px 2px rgba(0,0,0,.3)}
.bell{border:none; background:none; padding:0; width:auto; height:auto}
.bell .ico3d{--s:40px}
.bell .dot{top:-5px; right:-5px; border:2px solid var(--bg); min-width:20px; height:20px; background:#FF3B30}
.stat-ico{display:flex; align-items:center; gap:12px}
.stat-ico .ico3d{--s:46px}
.combo{position:relative}
.seg{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.seg .btn{background:var(--surface)}
.seg .btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
@media (max-width:600px){
  .launcher{grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px 6px; padding:16px 8px}
  .app-btn .ico3d{--s:56px}
  .app-btn .app-name{font-size:11.5px}
  .tab{padding:5px 10px 5px 5px}
  .tab .ico3d{--s:28px}
}
@media (max-width:340px){ .launcher{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (prefers-reduced-motion:reduce){ .bg-field::before{animation:none} }

/* ===== PIN screen ===== */
.pin-card{max-width:380px; text-align:center; padding:26px 22px 20px}
.pin-who{display:flex; align-items:center; gap:12px; text-align:left; margin-bottom:18px}
.avatar-lg{width:52px; height:52px; font-size:20px; background:linear-gradient(165deg,#2FD3A2,#0C6E55); color:#fff; box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5), 0 6px 14px -4px rgba(12,110,85,.5)}
.pin-name{font-weight:700; font-size:15.5px; line-height:1.3}
.pin-title{font-size:18px; margin:4px 0 16px}
.pin-dots{display:flex; justify-content:center; gap:12px; margin-bottom:10px; min-height:18px}
.pin-dot{width:15px; height:15px; border-radius:50%; border:2px solid var(--accent); background:transparent; transition:background .12s, transform .12s}
.pin-dot.on{background:var(--accent); transform:scale(1.08)}
.pin-dots.many{gap:8px}
.pin-dots.many .pin-dot{width:13px; height:13px}
.pin-dots.shake{animation:pinShake .38s}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.pin-msg{font-size:13px; color:var(--ink-dim); min-height:20px; margin-bottom:14px}
.pin-msg.bad{color:var(--bad); font-weight:600}
.keypad{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 18px; max-width:290px; margin:0 auto 14px; justify-items:center}
.keypad.off{opacity:.45; pointer-events:none}
.key{width:72px; height:72px; border-radius:50%; border:1px solid var(--glass-line); background:var(--surface); color:var(--ink);
  font-family:var(--font-mono); font-size:27px; font-weight:600; cursor:pointer; touch-action:manipulation;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6), 0 4px 12px -4px rgba(0,0,0,.25), inset 0 0 0 1px var(--glass-edge); transition:transform .08s, background .12s}
.key:active{transform:scale(.92); background:var(--accent-soft)}
.key-fn{font-family:var(--font-body); font-size:22px; background:transparent; box-shadow:none; border-color:transparent}
.pin-foot{display:flex; flex-direction:column; align-items:center; gap:4px}
button.user-chip{font:inherit; color:inherit; cursor:pointer; text-align:left}
.pin-badge{font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; white-space:nowrap}
.pin-badge.yes{background:var(--good-soft); color:var(--good)}
.pin-badge.no{background:var(--warn-soft); color:var(--warn)}
@media (max-width:360px){ .key{width:64px; height:64px; font-size:24px} .keypad{gap:12px 14px} }
@media (prefers-reduced-motion:reduce){ .pin-dots.shake{animation:none} }

/* ===== Employee list (compact card rows) ===== */
.emp-list{display:flex; flex-direction:column; gap:9px}
.emp-item{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--surface)}
.emp-item-top{display:flex; align-items:flex-start; gap:10px}
.emp-avatar{flex:0 0 auto; width:36px; height:36px; border-radius:999px; background:var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; letter-spacing:.02em}
.emp-item-info{flex:1; min-width:0}
.emp-name{font-weight:700; font-size:14.5px; line-height:1.35; overflow-wrap:anywhere}
.emp-item-sub{display:flex; flex-wrap:wrap; gap:5px 8px; align-items:center; margin-top:3px; font-size:11.5px; color:var(--ink-dim)}
.emp-item-meta{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 10px; margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:11.5px}
.emp-item-actions{display:flex; gap:6px; margin-top:9px; justify-content:flex-end}
.icon-btn{display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-dim); cursor:pointer}
.icon-btn svg{width:16px; height:16px}
.icon-btn:active{transform:scale(.92)}
.icon-btn.danger{color:var(--bad)}

/* ===== Brand logo image (replaces lettered badge) ===== */
.brand-logo{display:block; border-radius:50%; object-fit:cover; background:#fff; box-shadow:0 4px 12px -4px rgba(0,0,0,.3), 0 0 0 2px var(--glass-line)}

/* ===== Excel preview table ===== */
.modal.modal-wide{max-width:min(97vw,1280px)}
.xp-wrap{max-height:62vh; overflow:auto; border-radius:10px; border:1px solid var(--line)}
table.xp-table{border-collapse:collapse; width:max-content; min-width:100%; font-size:11.5px}
table.xp-table th,table.xp-table td{border:1px solid var(--line); padding:5px 7px; white-space:nowrap; text-align:left}
table.xp-table thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); font-weight:700; font-size:11px; text-transform:none}
table.xp-table th:first-child,table.xp-table td:first-child{position:sticky; left:0; z-index:1; background:var(--surface)}
table.xp-table thead th:first-child{z-index:3}
table.xp-table tbody tr:nth-child(even) td{background:var(--surface-2)}
table.xp-table tbody tr:nth-child(even) td:first-child{background:var(--surface-2)}
table.xp-table tr.xp-bold td{font-weight:700; background:var(--accent-soft)!important}

/* ===== Approval cards + 3-step tracker ===== */
.ap-list{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.ap-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 6px 18px -10px rgba(0,0,0,.25); min-width:0}
.ap-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px}
.ap-who{flex:1; min-width:0; overflow-wrap:anywhere}
.ap-who b{font-size:15px; line-height:1.35}
.ap-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-bottom:10px; background:var(--surface-2); border-radius:12px; padding:10px 12px}
.ap-grid div{min-width:0}
.ap-grid .wide{grid-column:1/-1}
.ap-grid span{display:block; font-size:11.5px; color:var(--ink-faint); font-weight:700}
.ap-grid b{font-size:14px; font-weight:600; overflow-wrap:anywhere}
.ap-ctx{border-radius:10px; padding:8px 11px; font-size:12.5px; margin-bottom:8px; line-height:1.45}
.ap-ctx.ok{background:var(--good-soft); color:var(--good)}
.ap-ctx.warn{background:var(--warn-soft); color:var(--warn)}
.ap-ctx.info{background:var(--info-soft); color:var(--info)}
.ap-actions{display:grid; grid-template-columns:1.4fr 1fr; gap:10px; margin-top:12px}
.ap-actions .btn{min-height:50px; font-size:15px}
.ap-actions .ico3d{--s:22px}
.count-big{display:inline-flex; min-width:28px; height:28px; padding:0 8px; border-radius:999px; background:#FF3B30; color:#fff; font-family:var(--font-mono); font-size:15px; align-items:center; justify-content:center; vertical-align:2px; margin-left:4px}
.track{display:grid; grid-template-columns:repeat(3,1fr); position:relative; margin-top:6px}
.tk{display:flex; flex-direction:column; align-items:center; text-align:center; gap:3px; position:relative; min-width:0; padding:0 2px}
.tk::before{content:""; position:absolute; top:13px; left:-50%; width:100%; height:3px; background:var(--line); z-index:0}
.tk:first-child::before{display:none}
.tk-done::before,.tk-wait::before,.tk-no::before{background:var(--accent)}
.tk-dot{position:relative; z-index:1; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--surface-3); color:var(--ink-faint); border:3px solid var(--surface)}
.tk-done .tk-dot{background:linear-gradient(165deg,#4FE09A,#0E9E62); color:#fff; box-shadow:0 3px 8px -2px rgba(14,158,98,.55)}
.tk-no .tk-dot{background:linear-gradient(165deg,#FF8A7A,#D7372C); color:#fff; box-shadow:0 3px 8px -2px rgba(215,55,44,.5)}
.tk-wait .tk-dot{background:linear-gradient(165deg,#FFD25A,#E59A0B); color:#fff; box-shadow:0 3px 8px -2px rgba(229,154,11,.55)}
.tk-pulse{width:8px; height:8px; border-radius:50%; background:#fff; animation:tkPulse 1.4s ease-in-out infinite}
@keyframes tkPulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.7)}}
.tk-t{font-size:12px; font-weight:700}
.tk-s{font-size:10.5px; color:var(--ink-faint); line-height:1.3; overflow-wrap:anywhere}

/* ===== Pop-up notification banners (top of screen) ===== */
.notif-stack{position:fixed; z-index:90; top:calc(10px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); width:min(420px, calc(100% - 24px)); display:flex; flex-direction:column; gap:8px; pointer-events:none}
.notif{pointer-events:auto; display:flex; align-items:center; gap:12px; padding:12px 12px 12px 12px; border-radius:20px; cursor:pointer;
  background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-line); box-shadow:0 18px 40px -12px rgba(0,0,0,.45), inset 0 0 0 1px var(--glass-edge);
  animation:notifIn .42s cubic-bezier(.2,.9,.25,1.2)}
.notif.out{animation:notifOut .25s ease-in forwards}
@keyframes notifIn{from{opacity:0; transform:translateY(-24px) scale(.96)}to{opacity:1; transform:none}}
@keyframes notifOut{to{opacity:0; transform:translateY(-16px) scale(.97)}}
.notif-txt{flex:1; min-width:0; display:flex; flex-direction:column; text-align:left}
.notif-app{font-size:10.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.02em}
.notif-txt b{font-size:14px; line-height:1.35}
.notif-txt span{font-size:12.5px; color:var(--ink-dim); line-height:1.4}
.notif-x{border:none; background:var(--surface-2); color:var(--ink-dim); width:40px; height:40px; border-radius:50%; font-size:18px; line-height:1; cursor:pointer; flex:none}
.notif-list{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto}
.notif-row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface-2); border:1px solid transparent; border-radius:14px; padding:10px 12px; cursor:pointer; font:inherit; color:inherit}
.notif-row.unread{background:var(--surface); border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
@media (prefers-reduced-motion:reduce){ .notif,.notif.out{animation:none} .tk-pulse{animation:none} }

/* ===== Deeper 3D icon tiles: raised base, bevel, embossed glyph ===== */
.ico3d{
  background:
    radial-gradient(130% 90% at 30% 0%, rgba(255,255,255,.38), transparent 55%),
    linear-gradient(170deg, var(--c1) 0%, var(--c2) 78%);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.65),
    inset 0 -3px 5px rgba(0,0,0,.28),
    inset 0 0 0 1px rgba(255,255,255,.12),
    0 calc(var(--s,44px) * .07) 0 0 var(--c3, rgba(0,0,0,.25)),
    0 calc(var(--s,44px) * .2) calc(var(--s,44px) * .32) calc(var(--s,44px) * -.08) var(--glow),
    0 1px 1px rgba(0,0,0,.2);
  transform:translateY(calc(var(--s,44px) * -.03));
}
.ico3d::before{left:8%; right:8%; top:4%; height:46%; border-radius:calc(var(--s,44px) * .22) calc(var(--s,44px) * .22) 45% 45% / calc(var(--s,44px) * .22) calc(var(--s,44px) * .22) 30% 30%;
  background:linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.06))}
.ico3d svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)) drop-shadow(0 2px 2px rgba(0,0,0,.25)) drop-shadow(0 -1px 0 rgba(255,255,255,.25)); stroke-width:2.3}
.ico3d.t-home{--c3:#2C3546}.ico3d.t-request{--c3:#0A7448}.ico3d.t-mine{--c3:#B85714}.ico3d.t-daily{--c3:#1553AA}
.ico3d.t-head{--c3:#086A63}.ico3d.t-hr{--c3:#432DA3}.ico3d.t-employees{--c3:#A8223F}.ico3d.t-reports{--c3:#AC7308}
.ico3d.t-brand{--c3:#08523F}.ico3d.t-bell{--c3:#A8322A}
/* sky-blue light look */
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .card{border-color:rgba(60,120,220,.12)} :root:not([data-theme="dark"]) h1,:root:not([data-theme="dark"]) h2,:root:not([data-theme="dark"]) h3{color:#0B1F4D} }
:root[data-theme="light"] .card{border-color:rgba(60,120,220,.12)}
:root[data-theme="light"] h1,:root[data-theme="light"] h2,:root[data-theme="light"] h3{color:#0B1F4D}
.mic-btn{display:inline-flex; align-items:center; gap:6px; margin:0 0 8px; min-height:44px}
.mic-btn.rec{background:var(--bad); color:#fff; animation:micp 1.1s ease-in-out infinite}
@keyframes micp{50%{opacity:.7}}
.share-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
.share-row .btn{min-height:40px; text-decoration:none}
.bal-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.bal-tile{border-radius:16px; padding:12px; background:linear-gradient(180deg,var(--surface),var(--surface-2)); border:1px solid var(--line,rgba(120,140,170,.25))}
.bal-t{font-weight:700; font-size:13px; margin-bottom:4px}
.bal-n{font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1.1}
.bal-n small{font-size:14px; font-weight:600}
.bal-annual .bal-n{color:#1F7BE0}.bal-sick .bal-n{color:#E0752A}
.bal-unset{font-size:16px!important}
@media (max-width:340px){ .bal-grid{grid-template-columns:1fr} }
.att-pick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px}
.att-btn{cursor:pointer; min-height:44px; display:inline-flex; align-items:center}
.att-row{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--surface-2); margin-bottom:6px}
.att-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.att-x{width:36px; height:36px; border:none; border-radius:10px; background:transparent; font-size:22px; cursor:pointer; color:var(--bad)}
.att-chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
.att-chip{min-height:40px; max-width:100%; padding:6px 12px; border-radius:999px; border:1px solid rgba(60,120,220,.3); background:var(--surface-2); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* illustrated icons */
.ico3d.illu{background:linear-gradient(180deg,#fff,#E9F2FF)!important; box-shadow:0 0 0 1px rgba(60,120,220,.14), 0 8px 18px -6px rgba(31,95,216,.38), inset 0 -3px 6px rgba(120,160,230,.18)!important; border-radius:calc(var(--s,44px)*.3)}
.ico3d.illu::before,.ico3d.illu::after{display:none!important}
.ico3d.illu svg{width:80%; height:80%; filter:drop-shadow(0 2px 2px rgba(20,60,140,.28)); stroke:none}
.app-btn:active .ico3d{transform:translateY(calc(var(--s,44px) * .03)) scale(.95); box-shadow:inset 0 2px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(0,0,0,.25), 0 1px 0 0 var(--c3), 0 2px 6px -2px var(--glow)}

/* ===== Calmer, easier-to-read background ===== */
.bg-field::before{inset:-25%; filter:saturate(115%);
  background:
    radial-gradient(42% 38% at 12% 8%, var(--aura-1), transparent 72%),
    radial-gradient(40% 34% at 92% 14%, var(--aura-2), transparent 72%),
    radial-gradient(50% 42% at 78% 100%, var(--aura-3), transparent 72%),
    radial-gradient(36% 30% at 0% 70%, var(--aura-2), transparent 72%),
    conic-gradient(from 210deg at 60% 40%, transparent, var(--aura-1), transparent 30%)}
.bg-field::after{opacity:.55}
.card,.login-card,.user-chip,.tabs-shell{background:var(--glass-strong)}

/* ===================== AI-era layer ===================== */
:root{ --ai-1:#10C79B; --ai-2:#2AAEF5; --ai-3:#8A7BFF; --ai-glow:rgba(42,174,245,.35);
  --ai-grad:linear-gradient(115deg,var(--ai-1) 0%,var(--ai-2) 55%,var(--ai-3) 100%);
  --ai-line:linear-gradient(140deg,rgba(16,199,155,.55),rgba(42,174,245,.28) 45%,rgba(138,123,255,.5)); }

function stOf(r){ if(r.status==="pending_head" && r.forDirector) return {t:"ລໍຖ້າອຳນວຍການ", cls:"pill-head"}; return r.expired ? {t:"ໝົດກຳນົດ (ບໍ່ອະນຸມັດໃນ "+APPROVE_DAYS+" ມື້)", cls:"pill-no"} : STATUS_LABEL[r.status]; }
function pendingAgeDays(r){ var t=Date.parse(r.submittedAt||""); return isNaN(t)?0:(Date.now()-t)/86400000; }
function daysLeft(r){ return Math.max(0, Math.ceil(APPROVE_DAYS-pendingAgeDays(r))); }
/* a request nobody finished approving within 10 days lapses (computed on load, nothing is overwritten) */
function applyExpiry(list){
  return list.map(function(r){
    if((r.status==="pending_head"||r.status==="pending_hr") && !(r.forDirector && r.status==="pending_head") && pendingAgeDays(r)>APPROVE_DAYS){
      return Object.assign({}, r, {status:"rejected", expired:true, rejectedBy:"ລະບົບ", rejectedAt:new Date(Date.parse(r.submittedAt)+APPROVE_DAYS*86400000).toISOString(),
        rejectReason:"ໝົດກຳນົດ: ບໍ່ໄດ້ອະນຸມັດພາຍໃນ "+APPROVE_DAYS+" ມື້ ນັບແຕ່ມື້ຂຽນ", rejectedStage: r.status==="pending_hr"?"hr":"head"});

  });

/* ================= Date helpers ================= */
function pad(n){return (n<10?"0":"")+n;}
function todayISO(){var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function firstOfMonth(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-01";}
function isoToDate(iso){var p=iso.split("-"); return new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));}
function fmtDateLao(iso){ if(!iso) return "-"; var d=isoToDate(iso); return d.getDate()+" "+LAO_MONTHS[d.getMonth()]+" "+d.getFullYear(); }
function fmtDateShort(iso){ if(!iso) return "-"; var d=isoToDate(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
function fmtDateTimeLao(iso){ var d=new Date(iso); return d.getDate()+" "+LAO_MONTHS[d.getMonth()]+" "+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())+" ນ."; }
function daysInclusive(aISO,bISO){ var a=isoToDate(aISO), b=isoToDate(bISO); return Math.round((b-a)/86400000)+1; }
function addDaysISO(iso,n){ var d=isoToDate(iso); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function overlap(aFrom,aTo,bFrom,bTo){ return aFrom<=bTo && aTo>=bFrom; }
function rid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ================= Lookups ================= */
function empById(id){ return state.employees.find(function(e){return e.id===id;}); }
function deptById(id){ return state.departments.find(function(d){return d.id===id;}); }
function deptName(id){ var d=deptById(id); return d? d.name : "-"; }
function me(){ return state.meId ? empById(state.meId) : null; }
function isHead(e){ return e && e.role==="head"; }
function isDirector(e){ return !!e && e.role==="director"; }   // ອຳນວຍການ: approves department heads' own leave first
function isHR(e){ return !!e && (e.role==="hr" || e.role==="admin"); }   // admin has every HR right
function isAdmin(e){ return !!e && e.role==="admin"; }
/* drop the title (ທ້າວ, ນາງ, ທ່ານ, ທ.) so an avatar shows the person's own name */
function shortName(full){
  var parts=(full||"").trim().split(/\s+/);
  while(parts.length>1 && /^(ທ້າວ|ນາງ|ທ່ານ|ທ່ານນາງ|ທ\.|ນ\.|ບ\.|Mr\.?|Ms\.?)$/.test(parts[0])) parts.shift();
  var p0=parts[0]||"";
  return p0.replace(/^(ທ\.|ນ\.|ບ\.)/,"");
}
function initials(name){ var n=shortName(name); var k=/^[ເແໂໃໄ]/.test(n)?2:1; return esc(n.slice(0,k))||"?"; }
function initialsOld(name){ if(!name) return "?"; return name.trim().slice(0,1); }

/* ================= Boot ================= */
function boot(){
  renderLoading();
  if(!window.claude || !window.claude.use){ renderNoRuntime(); return; }
  window.claude.use("db").then(function(db){
    if(!db){ renderNoRuntime(); return; }
    state.db = db; state.dbReady = true;
    subscribeAll();
  }).catch(function(){ renderNoRuntime(); });
}

function subscribeAll(){
  state.db.collection("employees").onSnapshot(function(snap){
    state.employees = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.loaded.employees = true; render();
  }, function(){ render(); });

  state.db.collection("departments").onSnapshot(function(snap){
    state.departments = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.departments.sort(function(a,b){ return (a.order||0)-(b.order||0); });
    state.loaded.departments = true; render();
  }, function(){ render(); });

  state.db.collection("requests").onSnapshot(function(snap){
    state.requests = applyExpiry(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
    state.requests.sort(function(a,b){ return (b.submittedAt||"").localeCompare(a.submittedAt||""); });
    state.loaded.requests = true; render();
  }, function(){ render(); });

  state.db.collection("pins").onSnapshot(function(snap){
    var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
    state.pins=m; state.loaded.pins=true; render();
  }, function(){ state.loaded.pins=true; render(); });

  state.db.collection("unlocks").onSnapshot(function(snap){
    state.unlocks = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.unlocks.sort(function(a,b){ return (b.requestedAt||"").localeCompare(a.requestedAt||""); });
    render();
  }, function(){ render(); });

  state.db.collection("holidays").onSnapshot(function(snap){
    state.holidays = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.loaded.holidays = true; render();
  }, function(){ state.loaded.holidays = true; render(); });
}
/* An approved unlock lets one employee submit leave that overlaps a colleague's, for that exact range */
function hasUnlock(empId, from, to){
  return state.unlocks.some(function(u){ return u.employeeId===empId && u.status==="approved" && !u.used && u.dateFrom<=from && u.dateTo>=to; });
}
function pendingUnlock(empId, from, to){
  return state.unlocks.find(function(u){ return u.employeeId===empId && u.status==="pending" && u.dateFrom===from && u.dateTo===to; });
}
function toast(msg, bad){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.className="toast"+(bad?" toast-bad":""); t.hidden=false;
  clearTimeout(toast._h); toast._h=setTimeout(function(){ t.hidden=true; },3200);
}

/* ================= PIN lock: 4-digit code per role (staff, head, HR, admin) =================
   Only a salted PBKDF2 hash is stored, never the PIN itself. */
var PIN_ITER = 120000, PIN_TRIES = 5, IDLE_LOCK_MS = 15*60*1000;
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
function pinLen(e){ return 4; }   // every role uses a 4-digit code
/* Each role starts with a shared starting PIN. Only its PBKDF2 hash lives here, never the digits.
   A person who sets their own PIN stops using the starting one. */
var DEFAULT_PIN_HASH = {"employee": "d3b73ae4506002b3f7d39061f261062bc493bf27445ed8c396a6cc143d779beb", "head": "3f54c5cd655d13611a0c8085a153441f72f830504bbf75bb297bd5d6b202891b", "hr": "f420ecb75437a7abe29a460161d5ebcd8acc7e4ac93a07914e8ffcb0740448ec", "director": "533efe3a09fb412e7290c72e8f89ec65c2b159871b7d99dcdadc7b7866a9fc70", "admin": "75465a05f085219dfb0ed31b3d28b8a750bcd5d7bbf7ee0b6cb9da71eee5be37"};
function hashDefault(pinValue, role){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pinValue), {name:"PBKDF2"}, false, ["deriveBits"])
    .then(function(k){ return crypto.subtle.deriveBits({name:"PBKDF2", salt:enc.encode("laophak-default-"+role), iterations:120000, hash:"SHA-256"}, k, 256); })
    .then(toHex);
}
function usesDefault(e){ return !!e && !pinDoc(e.id); }
function isRoleDefault(pinValue, role){ return DEFAULT_PIN_HASH[role] ? hashDefault(pinValue, role).then(function(h){ return h===DEFAULT_PIN_HASH[role]; }) : Promise.resolve(false); }
function pinDoc(id){ return state.pins[id] || null; }
function pinLenFor(e){ var d=pinDoc(e.id); return (d && d.len) ? d.len : pinLen(e); }
function pinSupported(){ return !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues && window.TextEncoder); }
function toHex(buf){ var b=new Uint8Array(buf), out=""; for(var i=0;i<b.length;i++){ out+=(b[i]<16?"0":"")+b[i].toString(16); } return out; }
function hashPin(pin, empId, salt, iter){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(pin+":"+empId), {name:"PBKDF2"}, false, ["deriveBits"])
    .then(function(k){ return crypto.subtle.deriveBits({name:"PBKDF2", salt:enc.encode(salt), iterations:iter, hash:"SHA-256"}, k, 256); })
    .then(toHex);
}
function savePin(empId, pinValue){
  var a=new Uint8Array(16); crypto.getRandomValues(a); var salt=toHex(a.buffer);
  return hashPin(pinValue, empId, salt, PIN_ITER).then(function(h){
    return state.db.collection("pins").doc(empId).set({salt:salt, hash:h, iter:PIN_ITER, len:pinValue.length, updatedAt:new Date().toISOString()});
  });
}
function checkPin(empId, pinValue){
  var d=pinDoc(empId);
  if(!d){ var e=empById(empId); if(!e || !DEFAULT_PIN_HASH[e.role]) return Promise.resolve(false);
    return hashDefault(pinValue, e.role).then(function(h){ return h===DEFAULT_PIN_HASH[e.role]; }); }
  return hashPin(pinValue, empId, d.salt, d.iter||PIN_ITER).then(function(h){ return h===d.hash; });
}
/* refuse PINs that are too easy to guess: all one digit, a straight run, or ascending pairs */
function weakPin(p){
  if(/^(\d)\1+$/.test(p)) return true;
  if(p.length%2===0 && p.length>=4){ var pairs=true; for(var j=0;j<p.length;j+=2){ if(p.charAt(j)!==p.charAt(j+1) || (j && p.charCodeAt(j)-p.charCodeAt(j-2)!==1)) pairs=false; } if(pairs) return true; }
  var up=true, down=true;
  for(var i=1;i<p.length;i++){ var d=p.charCodeAt(i)-p.charCodeAt(i-1); if(d!==1 && d!==-9) up=false; if(d!==-1 && d!==9) down=false; }
  return up||down;
}
/* wrong-PIN counter per person on this device: 5 wrong -> wait 1 min, then 2, 4 ... up to 15 min */
function failInfo(id){ try{ return JSON.parse(lsGet("laophak_fail_"+id)||"{}"); }catch(e){ return {}; } }
function lockLeft(id){ var f=failInfo(id); return f.until && f.until>Date.now() ? Math.ceil((f.until-Date.now())/1000) : 0; }
function addFail(id){
  var f=failInfo(id); f.n=(f.n||0)+1;
  if(f.n % PIN_TRIES===0){ var mins=Math.min(15, Math.pow(2, f.n/PIN_TRIES-1)); f.until=Date.now()+mins*60000; }
  lsSet("laophak_fail_"+id, JSON.stringify(f)); return f;
}
function clearFail(id){ lsDel("laophak_fail_"+id); }
function unlockAs(id){
  state.unlocked=id; ssSet("laophak_unlocked", id);
  state.pin={buf:"", mode:"", first:"", busy:false, err:"", shake:false};
  state.view="home"; state._dInit=false;
  var e=empById(id);
  if(e && isHead(e) && !e.deptConfirmed) state.modal={type:"headSetup", id:id};
  render();
}
function lockApp(){ state.unlocked=null; ssDel("laophak_unlocked"); state.modal=null; state.pin={buf:"", mode:"", first:"", busy:false, err:"", shake:false}; render(); }
(function(){ var u=ssGet("laophak_unlocked"); if(u && u===state.meId) state.unlocked=u; })();
// lock again when the phone was away from the app for 15 minutes
var hiddenAt=0;
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ hiddenAt=Date.now(); }
  else if(hiddenAt && state.unlocked && Date.now()-hiddenAt>IDLE_LOCK_MS){ lockApp(); }
});

/* update only the dots / OK button / message while typing a PIN (no full re-render = no flicker) */
function pinRefresh(n){
  var card=document.querySelector(".pin-card"), p=state.pin;
  if(!card){ render(); return; }
  var boxes=card.querySelectorAll(".pin-box");
  if(boxes.length!==n){ render(); return; }
  for(var i=0;i<boxes.length;i++){
    var on=i<p.buf.length;
    boxes[i].className="pin-box"+(on?" on":"")+(i===p.buf.length?" cur":"");
    var dot=boxes[i].firstChild; if(dot) dot.className="pin-dot"+(on?" on":"");
  }
  var ok=card.querySelector('[data-action="pinOk"]'); if(ok) ok.disabled=!(p.buf.length===n && !p.busy);
  var dots=card.querySelector(".pin-dots"); if(dots) dots.classList.remove("shake");
  var msg=card.querySelector(".pin-msg"); if(msg && !p.err){ msg.className="pin-msg"; msg.innerHTML="&nbsp;"; }
}
function pinPress(k){
  var emp=me(); if(!emp) return;
  var p=state.pin, n=pinLenFor(emp);
  if(p.busy || lockLeft(emp.id) || !pinSupported()) return;
  p.shake=false;
  if(k==="del"){ p.buf=p.buf.slice(0,-1); p.err=""; pinRefresh(n); return; }
  if(k==="ok"){ if(p.buf.length!==n) return; }
  else {
    if(!/^\d$/.test(k) || p.buf.length>=n) return;
    p.buf+=k; p.err=""; pinRefresh(n); return;   // wait for the OK button
  }
  var entered=p.buf;
  if(p.mode==="enter"){
    p.busy=true; render();
    checkPin(emp.id, entered).then(function(good){
      p.busy=false; p.buf="";
      if(good){ clearFail(emp.id); unlockAs(emp.id); return; }
      var f=addFail(emp.id), rest=PIN_TRIES-(f.n % PIN_TRIES);
      p.err = lockLeft(emp.id) ? "" : "ລະຫັດບໍ່ຖືກ. ລອງໄດ້ອີກ "+rest+" ເທື່ອ";
      p.shake=true; render();
    }, function(){ p.busy=false; p.buf=""; p.err="ກວດລະຫັດບໍ່ໄດ້, ລອງໃໝ່"; render(); });
  } else if(p.mode==="create"){
    if(weakPin(entered)){ p.buf=""; p.err="ລະຫັດງ່າຍເກີນໄປ. ກະລຸນາຕັ້ງໃໝ່"; p.shake=true; render(); return; }
    p.first=entered; p.buf=""; p.mode="confirm"; render();
  } else {
    if(entered!==p.first){ p.buf=""; p.first=""; p.mode="create"; p.err="ລະຫັດ 2 ຄັ້ງບໍ່ກົງກັນ. ຕັ້ງໃໝ່ອີກຄັ້ງ"; p.shake=true; render(); return; }
    p.busy=true; render();
    savePin(emp.id, entered).then(function(){ toast("ຕັ້ງລະຫັດສຳເລັດ"); unlockAs(emp.id); },
      function(){ p.busy=false; p.buf=""; p.mode="create"; p.err="ບັນທຶກລະຫັດບໍ່ສຳເລັດ, ລອງໃໝ່"; render(); });
  }
}
function bindPin(){
  document.querySelectorAll('[data-action="pinKey"]').forEach(function(b){
    b.addEventListener("click", function(){ pinPress(b.getAttribute("data-k")); });
  });
  var okb=document.querySelector('[data-action="pinOk"]');
  if(okb) okb.addEventListener("click", function(){ pinPress("ok"); });
  var sw=document.querySelector('[data-action="switchUser"]');
  if(sw) sw.addEventListener("click", function(){ state.meId=null; lsDel("laophak_emp_id"); lockApp(); });
  var sec=document.getElementById("lockSec");
  if(sec){ clearInterval(bindPin._t); bindPin._t=setInterval(function(){ var e=me(); var l=e?lockLeft(e.id):0; var el=document.getElementById("lockSec"); if(!el){ clearInterval(bindPin._t); return; } if(!l){ clearInterval(bindPin._t); render(); } else el.textContent=l; },1000); }
}
// a physical keyboard works too (desktop / tablet keyboard). Lao / Thai / Arabic-Indic digits typed with a Lao or Thai keyboard layout count as 0-9
function asciiDigit(ch){
  if(!ch || ch.length!==1) return "";
  var c=ch.charCodeAt(0);
  if(c>=48 && c<=57) return ch;
  if(c>=0x0ED0 && c<=0x0ED9) return String(c-0x0ED0);   // Lao ໐-໙
  if(c>=0x0E50 && c<=0x0E59) return String(c-0x0E50);   // Thai ๐-๙
  if(c>=0x0660 && c<=0x0669) return String(c-0x0660);   // Arabic-Indic
  if(c>=0xFF10 && c<=0xFF19) return String(c-0xFF10);   // full-width
  return "";
}
document.addEventListener("keydown", function(e){
  if(!state.meId || state.unlocked===state.meId || !document.querySelector(".pin-card")) return;
  var d = /^(?:Digit|Numpad)(\d)$/.test(e.code||"") ? RegExp.$1 : asciiDigit(e.key);
  if(d!==""){ e.preventDefault(); pinPress(d); }
  else if(e.key==="Backspace"){ e.preventDefault(); pinPress("del"); }
  else if(e.key==="Enter"){ e.preventDefault(); pinPress("ok"); }
});
// PIN fields in the change-PIN forms: convert Lao/Thai digits to 0-9 as they are typed
document.addEventListener("input", function(e){
  var t=e.target; if(!t || t.tagName!=="INPUT" || t.type!=="password") return;
  var v=t.value, o="", ch=false;
  for(var i=0;i<v.length;i++){ var d=asciiDigit(v.charAt(i)); if(d!=="" && d!==v.charAt(i)){ ch=true; o+=d; } else o+=v.charAt(i); }
  if(ch) t.value=o;
});

/* ================= Notifications: pop-up banners + bell panel =================
   staff submits      -> own department head
   head approves      -> HR (and the staff member)
   HR / head decides  -> the staff member */
function notifItems(emp){
  var out=[];
  if(isHead(emp)){
    state.requests.forEach(function(r){ if(r.status==="pending_head" && !r.forDirector && r.department===emp.department && r.employeeId!==emp.id)
      out.push({key:"rq:"+r.id+":ph", act:true, kind:"head", tab:"head", t:"ໃບລາໃໝ່ຈາກ "+shortName(r.employeeName), b:LEAVE_TYPE_MAP[r.leaveType].name+" · "+fmtDateShort(r.dateFrom)+(r.dateFrom!==r.dateTo?" - "+fmtDateShort(r.dateTo):"")+" · "+r.daysCount+" ມື້", at:r.submittedAt}); });
    state.unlocks.forEach(function(u){ if(u.status==="pending" && u.department===emp.department)
      out.push({key:"ul:"+u.id, act:true, kind:"head", tab:"head", t:shortName(u.employeeName)+" ຂໍລາຊ້ອນວັນ", b:fmtDateShort(u.dateFrom)+(u.dateFrom!==u.dateTo?" - "+fmtDateShort(u.dateTo):"")+" · ລໍຖ້າທ່ານອະນຸຍາດ", at:u.requestedAt}); });
  }

function keySet(name){ var raw=lsGet(name); if(raw===null) return null; try{ var a=JSON.parse(raw); var o={}; a.forEach(function(k){o[k]=1;}); return o; }catch(e){ return {}; } }
function saveKeySet(name, o){ var a=Object.keys(o); if(a.length>500) a=a.slice(a.length-500); lsSet(name, JSON.stringify(a)); }

var popSession = "";
function checkNotifs(){
  var emp=me(); if(!emp || state.unlocked!==emp.id || !state.loaded.requests) return;
  var name="laophak_pop_"+emp.id, popped=keySet(name), first = popped===null, items=notifItems(emp);
  popped = popped || {};
  var fresh = items.filter(function(i){ return !popped[i.key]; });
  if(first){
    // first time on this phone: don't replay old history, only what still needs action
    fresh = fresh.filter(function(i){ return i.act; });
    items.forEach(function(i){ if(!i.act){ popped[i.key]=1; var rd=keySet("laophak_read_"+emp.id)||{}; rd[i.key]=1; saveKeySet("laophak_read_"+emp.id, rd); } });
  }
  fresh.forEach(function(i){ popped[i.key]=1; });
  saveKeySet(name, popped);
  var acts = items.filter(function(i){ return i.act; }).length;
  if(popSession!==emp.id){
    popSession=emp.id;
    if(acts && !fresh.length) showPop({kind:isHR(emp)?"hr":"head", tab:isHR(emp)?"hr":"head", t:"ທ່ານມີ "+acts+" ລາຍການລໍຖ້າອະນຸມັດ", b:"ແຕະເພື່ອກວດເບິ່ງ"});
  }
  fresh.slice(0,3).forEach(function(i,n){ setTimeout(function(){ showPop(i); }, n*350); });
  if(fresh.length>3) setTimeout(function(){ showPop({kind:"bell", glyph:"bell", tab:"", t:"ແລະ ອີກ "+(fresh.length-3)+" ລາຍການ", b:"ແຕະກະດິ່ງເພື່ອເບິ່ງທັງໝົດ"}); }, 1100);

  el.innerHTML = ico(i.kind, i.glyph||i.kind, 40)+'<div class="notif-txt"><div class="notif-app">ຂະໜົມລາວ ລາພັກ · ດຽວນີ້</div><b></b><span></span></div><button type="button" class="notif-x" aria-label="ປິດ">×</button>';

  // heads open "who is off" on their own department; everyone else sees all departments
  if(state.meId && empById(state.meId) && !state._dInit){ state._dInit=true; var me0=empById(state.meId); state.dDept = isHead(me0)&&me0.department ? me0.department : "all"; }
  if(!state.meId || !empById(state.meId)){

    bindLogin();
    if(typing){ var ls=document.getElementById("loginSearch"); if(ls){ ls.focus(); try{ ls.setSelectionRange(ls.value.length, ls.value.length); }catch(e){} } }
    render._last = "";
    return;

  if(state.unlocked!==state.meId){
    app.innerHTML = pinView(me());
    bindPin();
    render._last = "";
    return;
  }
  // keep what the user is typing when live data from other people arrives
  var keep = {}, focusId = null, sameView = (render._last === state.view + "|" + (state.modal? state.modal.type+state.modal.id : ""));
  if(sameView){
    app.querySelectorAll("input[id],select[id],textarea[id]").forEach(function(el){ keep[el.id] = el.type==="checkbox" ? el.checked : el.value; });
    if(document.activeElement && document.activeElement.id) focusId = document.activeElement.id;
  }
  app.innerHTML = shellView();
  if(sameView){
    Object.keys(keep).forEach(function(id){ var el=document.getElementById(id); if(!el || el.disabled || el.hasAttribute("data-live")) return; if(el.type==="checkbox") el.checked=keep[id]; else el.value=keep[id]; });
  }
  render._last = state.view + "|" + (state.modal? state.modal.type+state.modal.id : "");
  labelTables(app);
  bindShell();
  if(focusId){ var f=document.getElementById(focusId); if(f) f.focus(); }
  checkNotifs();
}

/* annual-leave balance for the current year: quota + carry-over (only valid in the year it was set) - approved days */
function quotaInfo(e){
  var y=new Date().getFullYear();
  var carry = (e.carryYear===y ? (e.carryOver||0) : 0);
  var used = annualUsed(e.id, y);
  var pend = state.requests.filter(function(r){ return r.employeeId===e.id && r.leaveType==="annual" && (r.status==="pending_head"||r.status==="pending_hr") && isoToDate(r.dateFrom).getFullYear()===y; })
    .reduce(function(t,r){ return t+(r.daysCount||0); },0);
  var quota=e.quotaAnnual||0;
  return {year:y, quota:quota, carry:carry, total:quota+carry, used:used, pending:pend, remain:quota+carry-used, lastRemain:(e.quotaAnnual||0)-annualUsed(e.id,y-1)};
}
function sickInfo(e){
  var y=new Date().getFullYear(), q=(e.quotaSick==null||e.quotaSick==="")?null:Number(e.quotaSick);
  var used=state.requests.filter(function(r){ return r.employeeId===e.id && r.leaveType==="sick" && r.status==="approved" && isoToDate(r.dateFrom).getFullYear()===y; }).reduce(function(t,r){ return t+(r.daysCount||0); },0);
  var pend=state.requests.filter(function(r){ return r.employeeId===e.id && r.leaveType==="sick" && (r.status==="pending_head"||r.status==="pending_hr") && isoToDate(r.dateFrom).getFullYear()===y; }).reduce(function(t,r){ return t+(r.daysCount||0); },0);
  return {quota:q, used:used, pending:pend, remain:(q==null?null:q-used)};
}

function bindRequestForm(){
  var form = document.getElementById("reqForm");
  if(!form) return;
  bindAttach();
  var fFrom=document.getElementById("f_from"), fTo=document.getElementById("f_to"),
      fDays=document.getElementById("f_days"), fReturn=document.getElementById("f_return"),
      box=document.getElementById("conflictBox");
  function isLate(){ return !!fFrom.value && fFrom.value < addDaysISO(todayISO(),1); }
  function checkLate(){ var w=document.getElementById("lateWarn"), o=document.getElementById("lateOk"); if(!w||!o) return; var l=isLate(); w.hidden=!l; o.hidden=l; }
  fFrom.addEventListener("change", checkLate);
  function recalc(){
    if(fTo.value < fFrom.value) fTo.value = fFrom.value;
    fDays.value = daysInclusive(fFrom.value, fTo.value);
    fReturn.value = addDaysISO(fTo.value, 1);
    checkConflict();
  }
  var submitBtn = form.querySelector('button[type="submit"]');
  function checkConflict(){
    var emp = me();
    var from=fFrom.value, to=fTo.value;
    var dep = selDept();
    var conflicts = findConflicts(dep, from, to, emp.id);
    var list = conflicts.map(function(c){ return '• '+esc(c.employeeName)+' ('+fmtDateShort(c.dateFrom)+' - '+fmtDateShort(c.dateTo)+')'; }).join("<br>");
    if(!conflicts.length){ box.innerHTML=""; submitBtn.disabled=false; return; }
    if(hasUnlock(emp.id, from, to)){
      box.innerHTML = '<div class="unlock-box"><b>ຫົວໜ້າພະແນກອະນຸຍາດໃຫ້ລາຊ້ອນແລ້ວ.</b> ທ່ານສາມາດສົ່ງໃບລາໄດ້.<br>'+list+'</div>';
      submitBtn.disabled=false; return;
    }
    submitBtn.disabled=true;
    var pend = pendingUnlock(emp.id, from, to);
    box.innerHTML = '<div class="conflict-box"><b>ວັນທີ່ນີ້ມີເພື່ອນຮ່ວມພະແນກລາແລ້ວ:</b><br>'+list+
      '<br><br>ລາຊ້ອນກັນບໍ່ໄດ້. ຕ້ອງຂໍໃຫ້ຫົວໜ້າພະແນກອະນຸຍາດກ່ອນ ຈຶ່ງຈະສົ່ງໃບລາໄດ້.</div>'+
      (pend ? '<div class="hint">ສົ່ງຄຳຂໍໄປຫາຫົວໜ້າແລ້ວ. ລໍຖ້າຫົວໜ້າອະນຸຍາດ.</div>'
            : '<button type="button" class="btn btn-block" id="askUnlock" style="margin-bottom:12px">ຂໍໃຫ້ຫົວໜ້າອະນຸຍາດລາຊ້ອນ</button>');
    var ask = document.getElementById("askUnlock");
    if(ask) ask.addEventListener("click", function(){
      ask.disabled=true;
      state.db.collection("unlocks").add({
        employeeId: emp.id, employeeName: emp.firstName+" "+emp.lastName,
        department: dep, dateFrom: from, dateTo: to,
        reason: document.getElementById("f_reason").value,
        status:"pending", requestedAt:new Date().toISOString()
      }).then(function(){ toast("ສົ່ງຄຳຂໍໄປຫາຫົວໜ້າພະແນກແລ້ວ"); })
        .catch(function(){ ask.disabled=false; toast("ສົ່ງບໍ່ສຳເລັດ, ລອງໃໝ່ອີກຄັ້ງ", true); });
    });
  }
  function selDept(){ var d=document.getElementById("f_dept"); return (d && d.value) || me().department; }
  document.getElementById("f_dept").addEventListener("change", checkConflict);
  fFrom.addEventListener("change", recalc);
  fTo.addEventListener("change", recalc);
  checkConflict(); checkLate();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var emp = me();
    var from=fFrom.value, to=fTo.value;
    if(!from || !to || to<from){ toast("ວັນທີ່ບໍ່ຖືກຕ້ອງ: ວັນສິ້ນສຸດຕ້ອງບໍ່ກ່ອນວັນເລີ່ມ", true); return; }
    if(!document.getElementById("f_reason").value.trim()){ toast("ກະລຸນາໃສ່ເຫດຜົນທີ່ລາ", true); return; }
    var late = isLate(), lateReason = (document.getElementById("f_late")||{value:""}).value.trim();
    if(late && !lateReason){ toast("ຂຽນຕາມຫຼັງ: ກະລຸນາແຈ້ງເຫດຜົນທີ່ຂຽນຊ້າ", true); return; }
    var dep = selDept();
    var conflicts = findConflicts(dep, from, to, emp.id);
    if(conflicts.length && !hasUnlock(emp.id, from, to)){ toast("ວັນທີ່ຊ້ອນກັບເພື່ອນ: ຕ້ອງຂໍອະນຸຍາດຈາກຫົວໜ້າກ່ອນ", true); return; }
    var unlockUsed = conflicts.length ? state.unlocks.find(function(u){ return u.employeeId===emp.id && u.status==="approved" && !u.used && u.dateFrom<=from && u.dateTo>=to; }) : null;
    var payload = {
      employeeId: emp.id,
      employeeName: emp.firstName+" "+emp.lastName,
      department: dep,
      departmentName: deptName(dep),
      position: document.getElementById("f_pos").value || "-",
      leaveType: document.getElementById("f_type").value,
      dateFrom: from, dateTo: to,
      daysCount: parseFloat(document.getElementById("f_days").value)||1,
      returnDate: fReturn.value,
      delegate: document.getElementById("f_delegate").value.trim(),
      reason: document.getElementById("f_reason").value,
      submittedAt: new Date().toISOString(),
      status: isDirector(emp) ? "pending_hr" : "pending_head",
      forDirector: isHead(emp),
      late: late, lateReason: late ? lateReason : "",
      conflict: conflicts.length>0
    };
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "ກຳລັງສົ່ງ...";
    var files = draft.imgs.concat(draft.pdfs), metas=[], stamp=Date.now();
    var ups = files.map(function(f,i){
      var id="att_"+emp.id+"_"+stamp+"_"+i; metas.push({id:id, name:f.name, type:f.type, size:f.size});
      return state.db.collection("attachments").doc(id).set({employeeId:emp.id, name:f.name, type:f.type, size:f.size, data:f.data, createdAt:new Date().toISOString()});
    });
    Promise.all(ups).then(function(){
      if(metas.length) payload.attachments = metas;
      return state.db.collection("requests").add(payload);
    }).then(function(){
      draft={imgs:[], pdfs:[]};
      if(unlockUsed) state.db.collection("unlocks").doc(unlockUsed.id).update({used:true});
      toast("ສົ່ງໃບລາແລ້ວ. ແຈ້ງໄປຫາຫົວໜ້າພະແນກ ແລະ HR ແລ້ວ");
      state.view = "mine"; state.modal=null; render();
    }).catch(function(){
      toast("ສົ່ງບໍ່ສຳເລັດ. ກວດເບິ່ງອິນເຕີເນັດ ແລ້ວລອງໃໝ່", true); btn.disabled=false; btn.textContent="ສົ່ງໃບລາ";
    });
  });
}

/* ================= My requests ================= */
var ATT_MAX=3, ATT_PDF_MAX=650000;
var draft={imgs:[], pdfs:[]};
function fmtKB(n){ return Math.max(1,Math.round(n/1000))+" KB"; }
function readAsDataURL(file){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=function(){rej();}; fr.readAsDataURL(file); }); }
function shrinkImage(file){
  return readAsDataURL(file).then(function(url){ return new Promise(function(res,rej){
    var im=new Image(); im.onload=function(){
      var max=1280, w=im.width, h=im.height, k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      var c=document.createElement("canvas"); c.width=w; c.height=h; var cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
      var q=0.72, out=c.toDataURL("image/jpeg",q);
      while(out.length>800000 && q>0.3){ q-=0.12; out=c.toDataURL("image/jpeg",q); }
      if(out.length>900000){ rej(); return; }
      res({name:(file.name||"image").replace(/\.[^.]+$/,"")+".jpg", type:"image/jpeg", size:Math.round(out.length*0.75), data:out});
    }; im.onerror=function(){ rej(); }; im.src=url; }); });
}
function paintDraft(){
  var box=document.getElementById("attList"); if(!box) return;
  function row(kind,i,f){ return '<div class="att-row"><span class="att-ic">'+(kind==="imgs"?'🖼':'📄')+'</span><span class="att-name">'+esc(f.name)+'</span><span class="faint">'+fmtKB(f.size)+'</span><button type="button" class="att-x" data-kind="'+kind+'" data-i="'+i+'" aria-label="ເອົາອອກ">×</button></div>'; }
  box.innerHTML = draft.imgs.map(function(f,i){ return row("imgs",i,f); }).join("")+draft.pdfs.map(function(f,i){ return row("pdfs",i,f); }).join("");
  box.querySelectorAll(".att-x").forEach(function(b){ b.addEventListener("click", function(){ draft[b.getAttribute("data-kind")].splice(parseInt(b.getAttribute("data-i"),10),1); paintDraft(); }); });
}
function bindAttach(){
  var fi=document.getElementById("f_imgs"), fp=document.getElementById("f_pdfs"); if(!fi||!fp) return;
  paintDraft();
  fi.addEventListener("change", function(){
    var files=Array.prototype.slice.call(fi.files||[]); fi.value="";
    var room=ATT_MAX-draft.imgs.length; if(files.length>room) toast("ແນບຮູບໄດ້ສູງສຸດ "+ATT_MAX+" ຮູບ", true);
    files.slice(0,Math.max(0,room)).forEach(function(f){ shrinkImage(f).then(function(x){ if(draft.imgs.length<ATT_MAX){ draft.imgs.push(x); paintDraft(); } }, function(){ toast("ໃຊ້ຮູບນີ້ບໍ່ໄດ້: "+f.name, true); }); });
  });
  fp.addEventListener("change", function(){
    var files=Array.prototype.slice.call(fp.files||[]); fp.value="";
    var room=ATT_MAX-draft.pdfs.length; if(files.length>room) toast("ແນບ PDF ໄດ້ສູງສຸດ "+ATT_MAX+" ໄຟລ໌", true);
    files.slice(0,Math.max(0,room)).forEach(function(f){
      if(f.size>ATT_PDF_MAX){ toast(f.name+" ໃຫຍ່ເກີນ ("+fmtKB(f.size)+"). ຈຳກັດ "+Math.round(ATT_PDF_MAX/1000)+" KB", true); return; }
      readAsDataURL(f).then(function(d){ if(draft.pdfs.length<ATT_MAX){ draft.pdfs.push({name:f.name, type:"application/pdf", size:f.size, data:d}); paintDraft(); } }, function(){ toast("ອ່ານໄຟລ໌ບໍ່ໄດ້", true); });
    });
  });
}

  if(r.status==="pending_hr"||(r.status==="pending_head"&&!r.forDirector)){ var d=daysLeft(r); h+='<div class="faint" style="margin:4px 0;'+(d<=3?'color:var(--bad);font-weight:700':'')+'">ກຳນົດອະນຸມັດ: ເຫຼືອ '+d+' ມື້ (ເກີນ '+APPROVE_DAYS+' ມື້ ຖືວ່າໝົດກຳນົດ)</div>'; }
  return h;
}

function dataUrlToBlobUrl(d){ try{ var p=d.split(","), mime=(p[0].match(/:(.*?);/)||[])[1]||"application/octet-stream", bin=atob(p[1]), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return URL.createObjectURL(new Blob([u],{type:mime})); }catch(e){ return d; } }
function openAtt(id,name,type){
  state.modal={type:"att", name:name, loading:true}; render();
  state.db.collection("attachments").doc(id).get().then(function(snap){
    var d = snap && (typeof snap.data==="function" ? snap.data() : snap);
    if(!d || !d.data){ state.modal={type:"att", name:name, error:true}; render(); return; }
    state.modal={type:"att", name:name, mime:type, url: type==="application/pdf" ? dataUrlToBlobUrl(d.data) : d.data}; state.modal.type="att"; state.modal.typeMime=type; render();
  }, function(){ state.modal={type:"att", name:name, error:true}; render(); });
}

/* ===== CSV export, grouped by legal entity ===== */
function csvCell(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function exportCsv(){
  var from=state.reportFrom, to=state.reportTo, dept=state.reportDept, emp=me();
  if(!isHR(emp)) return;
  var rows=state.requests.filter(function(r){ return overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept); });
  rows=rows.map(function(r){ var e=empById(r.employeeId)||{}; return {co:e.company||"(ຍັງບໍ່ລະບຸບໍລິສັດ)", r:r}; });
  rows.sort(function(a,b){ return a.co.localeCompare(b.co) || a.r.employeeName.localeCompare(b.r.employeeName) || a.r.dateFrom.localeCompare(b.r.dateFrom); });
  var head=["ບໍລິສັດ","ພະແນກ","ພະນັກງານ","ປະເພດ","ຈາກວັນທີ","ຫາວັນທີ","ຈຳນວນມື້","ສະຖານະ","ຫົວໜ້າອະນຸມັດ","ເວລາຫົວໜ້າ","HR ອະນຸມັດ","ເວລາ HR","ເຫດຜົນ"];
  var out=[head.map(csvCell).join(",")], sums={};
  rows.forEach(function(x){ var r=x.r;
    out.push([x.co, r.departmentName||deptName(r.department), r.employeeName, (LEAVE_TYPE_MAP[r.leaveType]||{name:r.leaveType}).name, r.dateFrom, r.dateTo, r.daysCount, (stOf(r)||{t:r.status}).t, r.headApprovedBy||"", r.headApprovedAt||"", r.hrApprovedBy||"", r.hrApprovedAt||"", r.reason||""].map(csvCell).join(","));
    if(r.status==="approved") sums[x.co]=(sums[x.co]||0)+(r.daysCount||0);
  });
  out.push(""); out.push(["ສະຫຼຸບວັນລາທີ່ອະນຸມັດແລ້ວ ແຍກຕາມບໍລິສັດ","ວັນ"].map(csvCell).join(","));
  Object.keys(sums).sort().forEach(function(k){ out.push([k,sums[k]].map(csvCell).join(",")); });
  var co = dept==="all" ? "AllDepts" : "Dept";
  var fname = from+"_"+co+"_LeaveReport_to"+to+"_v1.csv";
  var data="\ufeff"+out.join("\r\n");
  window.claude.use("downloads").then(function(dl){
    if(!dl){ toast("ບໍ່ສາມາດດາວໂຫຼດໃນໜ້ານີ້", true); return; }
    dl.save({filename:fname, data:data}).then(function(){ toast("ບັນທຶກໄຟລ໌ແລ້ວ: "+fname); }, function(e){ if(!e||e.code!=="declined") toast("ບັນທຶກບໍ່ສຳເລັດ", true); });
  });
}

/* preview the sheets as HTML before committing to a download */
function previewXlsx(){

  var from=state.reportFrom, to=state.reportTo, dept=state.reportDept;
  if(!from || !to || from>to){ toast("ວັນທີ່ບໍ່ຖືກຕ້ອງ: ວັນສິ້ນສຸດຕ້ອງບໍ່ກ່ອນວັນເລີ່ມ", true); return; }

}
function exportXlsx(){

/* ================= Who is off: date range + department + person ================= */
function canAct(emp, r){
  if(isHead(emp) && r.status==="pending_head" && !r.forDirector && r.department===emp.department) return "head";
  if(isDirector(emp) && r.status==="pending_head" && r.forDirector && r.employeeId!==emp.id) return "head";
  if(isHR(emp) && r.status==="pending_hr") return "hr";
  return "";
}
function dailyMatches(){
  var from=state.dFrom, to=state.dTo, dep=state.dDept, q=(state.dPerson||"").trim().toLowerCase();

    if(!overlap(from,to,r.dateFrom,r.dateTo)) return false;
    if(dep!=="all" && r.department!==dep) return false;
    if(q && (r.employeeName||"").toLowerCase().indexOf(q)<0) return false;

function refreshDaily(){

function bindDaily(){
  var f=document.getElementById("dFrom"), t=document.getElementById("dTo"), d=document.getElementById("dDept"), p=document.getElementById("dPerson");
  function dates(){
    if(!f.value) f.value=todayISO();

    state.dFrom=f.value; state.dTo=t.value; state.dQuick="";
    document.querySelectorAll('[data-action="dQuick"]').forEach(function(b){ b.classList.remove("on"); });
    refreshDaily();
  }
  f.addEventListener("change", dates); t.addEventListener("change", dates);
  d.addEventListener("change", function(){ state.dDept=d.value; refreshDaily(); });
  p.addEventListener("input", function(){ state.dPerson=p.value; refreshDaily(); });
  document.querySelector('[data-action="dClear"]').addEventListener("click", function(){ p.value=""; state.dPerson=""; refreshDaily(); p.focus(); });
  document.querySelectorAll('[data-action="dQuick"]').forEach(function(b){
    b.addEventListener("click", function(){
      var q=b.getAttribute("data-q"), td=todayISO(), now=isoToDate(td);

      else if(q==="month"){ state.dFrom=firstOfMonth(now); var last=new Date(now.getFullYear(), now.getMonth()+1, 0); state.dTo=last.getFullYear()+"-"+pad(last.getMonth()+1)+"-"+pad(last.getDate()); }

function shortStamp(iso){ if(!iso) return ""; var d=new Date(iso); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function rejectStage(r){ return r.status!=="rejected" ? "" : (r.rejectedStage || (r.headApprovedAt ? "hr" : "head")); }
/* the 3-step path every request takes: sent -> department head -> HR */
function tracker(r){
  var s=r.status, rs=rejectStage(r);
  var steps=[
    {t:"ສົ່ງໃບລາ", st:"done", sub:shortStamp(r.submittedAt)},
    {t:(r.forDirector?"ອຳນວຍການ":"ຫົວໜ້າພະແນກ"), st: s==="pending_head"?"wait":(rs==="head"?"no":"done"),
      sub: rs==="head" ? shortName(r.rejectedBy)+" · "+shortStamp(r.rejectedAt) : (r.headApprovedBy ? shortName(r.headApprovedBy)+" · "+shortStamp(r.headApprovedAt) : (s==="pending_head" ? "ລໍຖ້າ" : "ອະນຸມັດແລ້ວ"))},
    {t:"HR", st: s==="approved"?"done":(s==="pending_hr"?"wait":(rs==="hr"?"no":"todo")),
      sub: s==="approved" ? shortName(r.hrApprovedBy)+" · "+shortStamp(r.hrApprovedAt) : (rs==="hr" ? shortName(r.rejectedBy)+" · "+shortStamp(r.rejectedAt) : (s==="pending_hr"?"ລໍຖ້າ":""))}
  ];
  var mark={done:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
            no:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
            wait:'<span class="tk-pulse"></span>', todo:''};
  return '<div class="track">'+steps.map(function(x){
    return '<div class="tk tk-'+x.st+'"><span class="tk-dot">'+mark[x.st]+'</span><span class="tk-t">'+x.t+'</span><span class="tk-s">'+esc(x.sub||"")+'</span></div>';
  }).join("")+'</div>';
}
function sameTimeOff(r){
  return state.requests.filter(function(x){ return x.id!==r.id && x.department===r.department && x.employeeId!==r.employeeId && x.status!=="rejected" && overlap(r.dateFrom,r.dateTo,x.dateFrom,x.dateTo); });

function bindApprovalActions(stage){
  document.querySelectorAll('[data-action="approve"]').forEach(function(b){
    b.addEventListener("click", function(){
      var r = state.requests.find(function(x){return x.id===b.getAttribute("data-id");});
      if(!r) return;
      if(r.conflict){ state.modal = {type:"confirmApprove", id:r.id, stage:b.getAttribute("data-stage")}; render(); return; }
      doApprove(r.id, b.getAttribute("data-stage"));
    });
  });
  document.querySelectorAll('[data-action="reject"]').forEach(function(b){
    b.addEventListener("click", function(){
      state.modal = {type:"reject", id:b.getAttribute("data-id")};
      render();
    });
  });
  document.querySelectorAll('[data-action="unlockOk"],[data-action="unlockNo"]').forEach(function(b){
    b.addEventListener("click", function(){
      var ok = b.getAttribute("data-action")==="unlockOk", emp=me();
      b.disabled = true;
      state.db.collection("unlocks").doc(b.getAttribute("data-id")).update({
        status: ok? "approved":"rejected", decidedBy: emp.firstName+" "+emp.lastName, decidedAt: new Date().toISOString()
      }).then(function(){ toast(ok? "ອະນຸຍາດແລ້ວ. ລູກທີມສາມາດສົ່ງໃບລາໄດ້" : "ບໍ່ອະນຸຍາດແລ້ວ"); });
    });
  });
  var sel = document.getElementById("hrAllDept");
  if(sel) sel.addEventListener("change", function(){
    var list = sel.value==="all" ? state.requests : state.requests.filter(function(r){return r.department===sel.value;});
    document.getElementById("hrAllTable").innerHTML = allRequestsTable(list,"all");
    labelTables(document.getElementById("hrAllTable"));
  });
}
function doApprove(id, stage){
  var emp = me();
  var ref = state.db.collection("requests").doc(id);
  var patch = {};
  if(stage==="head"){ patch = {status:"pending_hr", headApprovedAt:new Date().toISOString(), headApprovedBy: emp.firstName+" "+emp.lastName}; }
  else { patch = {status:"approved", hrApprovedAt:new Date().toISOString(), hrApprovedBy: emp.firstName+" "+emp.lastName}; }
  ref.update(patch).then(function(){ toast(stage==="head" ? "ອະນຸມັດແລ້ວ. ສົ່ງຕໍ່ໄປໃຫ້ HR ກວດແລ້ວ" : "HR ອະນຸມັດແລ້ວ. ແຈ້ງພະນັກງານແລ້ວ"); });
  state.modal=null; render();
  fireConfetti();
}
function doReject(id, reason){
  var emp = me();
  state.db.collection("requests").doc(id).update({
    status:"rejected", rejectedAt:new Date().toISOString(), rejectedBy: emp.firstName+" "+emp.lastName, rejectReason: reason||"-",
    absent: !!(state.requests.find(function(x){return x.id===id;})||{}).late,
    rejectedStage: (state.requests.find(function(x){return x.id===id;})||{}).status==="pending_hr" ? "hr" : "head"
  }).then(function(){ toast("ບໍ່ອະນຸຍາດແລ້ວ. ແຈ້ງພະນັກງານແລ້ວ"); });
  state.modal=null; render();
}

function bindEmployees(){

      firstName: document.getElementById("e_first").value.trim(),
