function reportBody(){
  var from=state.reportFrom, to=state.reportTo, dept=state.reportDept;
  // Only the days that fall inside the chosen range are counted
  var approved = state.requests.filter(function(r){
    return (r.status==="approved" || (r.status==="rejected" && r.late && r.absent)) && overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept);
  }).map(function(r){
    var a = r.dateFrom>from? r.dateFrom : from, b = r.dateTo<to? r.dateTo : to;
    var inRange = Math.min(r.daysCount||0, daysInclusive(a,b));
    return Object.assign({}, r, {daysCount: inRange, leaveType: r.status==="approved" ? r.leaveType : "absent"});
  });
  var totalDays = approved.reduce(function(s,r){return s+r.daysCount;},0);
  var byDept = {};
  state.departments.forEach(function(d){ byDept[d.id]={id:d.id, name:d.name, days:0, count:0, types:{}}; });
  approved.forEach(function(r){ var b=byDept[r.department]; if(b){ b.days+=r.daysCount; b.count+=1; b.types[r.leaveType]=(b.types[r.leaveType]||0)+r.daysCount; } });
  var headcount = function(id){ return state.employees.filter(function(e){return e.department===id;}).length; };
  var matrixRows = Object.keys(byDept).map(function(k){return byDept[k];}).filter(function(d){ return dept==="all"||d.id===dept; }).sort(function(a,b){return b.days-a.days;}).map(function(d){
    var hc = headcount(d.id);
    return '<tr><td><b>'+esc(d.name)+'</b><div class="faint">'+hc+' ຄົນ</div></td>'+
      LEAVE_TYPES.map(function(t){ var v=d.types[t.id]||0; return '<td class="mono">'+(v? v.toFixed(1):'<span class="faint">0</span>')+'</td>'; }).join("")+
      '<td class="mono" style="font-weight:700">'+d.days.toFixed(1)+'</td>'+
      '<td class="mono">'+(totalDays>0? (d.days/totalDays*100).toFixed(1):'0.0')+'%</td>'+
      '<td class="mono">'+(hc? (d.days/hc).toFixed(2):'-')+'</td></tr>';
  }).join("");
  var matrix = '<div class="card" style="margin-bottom:14px"><h3>ລາຍລະອຽດແຕ່ລະພະແນກ ແຍກຕາມປະເພດ (ມື້)</h3><div class="faint" style="margin:-6px 0 8px">ເທິງມືຖື ປັດຕາຕະລາງໄປຊ້າຍ-ຂວາ ເພື່ອເບິ່ງທຸກຖັນ</div><div class="table-wrap"><table class="wide"><thead><tr><th>ພະແນກ</th>'+
    LEAVE_TYPES.map(function(t){return '<th>'+t.name+'</th>';}).join("")+'<th>ລວມ</th><th>% ຂອງທັງໝົດ</th><th>ສະເລ່ຍ/ຄົນ</th></tr></thead><tbody>'+matrixRows+'</tbody></table></div></div>';
  var deptArr = Object.keys(byDept).map(function(k){return byDept[k];}).filter(function(d){ return dept==="all"||d.id===dept; }).sort(function(a,b){return b.days-a.days;});
  var maxDeptDays = Math.max.apply(null, deptArr.map(function(d){return d.days;}).concat([0.0001]));

  var byType = {}; LEAVE_TYPES.forEach(function(t){ byType[t.id]={name:t.name, days:0, count:0}; });

  var maxTypeDays = Math.max.apply(null, LEAVE_TYPES.map(function(t){return byType[t.id].days;}).concat([0.0001]));

  }).join("") || '<div class="empty">ບໍ່ມີຂໍ້ມູນ</div>';

  var typeBars = LEAVE_TYPES.map(function(t){
    var d = byType[t.id];
    var pct = totalDays>0 ? (d.days/totalDays*100):0;
    return '<div class="bar-row"><div class="bar-label">'+t.name+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(d.days/maxTypeDays*100)+'%"></div></div><div class="bar-val">'+d.days.toFixed(1)+' ມື້ · '+pct.toFixed(0)+'%</div></div>';
  }).join("");

  var empList = state.employees.filter(function(e){ return dept==="all"||e.department===dept; });
  var empRows = empList.map(function(e){
    var used = annualUsed(e.id, new Date().getFullYear());

  }).join("") || '<tr><td colspan="6"><div class="empty">ບໍ່ມີຂໍ້ມູນ</div></td></tr>';

  return dashboardPanel(from, to, dept) + '<div class="grid grid-3" style="margin-bottom:14px">'+
    '<div class="card"><div class="stat-ico">'+ico("reports")+'<div class="stat"><div class="num">'+approved.length+'</div><div class="lbl">ຈຳນວນໃບລາທີ່ອະນຸມັດແລ້ວ</div></div></div></div>'+
    '<div class="card"><div class="stat-ico">'+ico("mine")+'<div class="stat"><div class="num">'+totalDays.toFixed(1)+'</div><div class="lbl">ລວມວັນລາ (ມື້)</div></div></div></div>'+
    '<div class="card"><div class="stat-ico">'+ico("employees")+'<div class="stat"><div class="num">'+uniqCount(approved.map(function(r){return r.employeeId;}))+'</div><div class="lbl">ຈຳນວນພະນັກງານທີ່ລາ</div></div></div></div>'+

function bindReports(){
  var mo=document.getElementById("rpMonth");
  if(mo && !mo._b){ mo._b=1; mo.addEventListener("change", function(){
    var v=mo.value; if(!/^\d{4}-\d{2}$/.test(v)) return;
    var y=+v.slice(0,4), m=+v.slice(5,7), last=new Date(y,m,0).getDate();
    state.reportFrom=v+"-01"; state.reportTo=v+"-"+(last<10?"0":"")+last;
    var f=document.getElementById("rpFrom"), t=document.getElementById("rpTo"); if(f) f.value=state.reportFrom; if(t) t.value=state.reportTo;
    document.getElementById("reportBody").innerHTML = reportBody(); labelTables(document.getElementById("reportBody")); bindReports();
  }); }
  ["rpFrom","rpTo","rpDept"].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("change", function(){
      state.reportFrom = document.getElementById("rpFrom").value;
      state.reportTo = document.getElementById("rpTo").value;
      state.reportDept = document.getElementById("rpDept").value;
      document.getElementById("reportBody").innerHTML = reportBody();
      labelTables(document.getElementById("reportBody"));
      bindReports();

function bindModal(){
  var backdrop = document.querySelector('[data-action="closeModal"]');
  if(backdrop) backdrop.addEventListener("click", function(e){ if(e.target===backdrop && state.modal && state.modal.type!=="headSetup"){ state.modal=null; render(); } });
  document.querySelectorAll('[data-action="closeModalBtn"]').forEach(function(b){ b.addEventListener("click", function(){ state.modal=null; render(); }); });
  var confirmReject = document.querySelector('[data-action="confirmReject"]');
  if(confirmReject) confirmReject.addEventListener("click", function(){
    var reason = document.getElementById("rejectReason").value.trim();
    doReject(confirmReject.getAttribute("data-id"), reason);
  });
  var ack = document.getElementById("ackConflict");
  if(ack) ack.addEventListener("change", function(){
    document.getElementById("confirmApproveBtn").disabled = !ack.checked;
  });
  var confirmApproveBtn = document.getElementById("confirmApproveBtn");
  if(confirmApproveBtn) confirmApproveBtn.addEventListener("click", function(){
    doApprove(state.modal.id, state.modal.stage);
  });
  document.querySelectorAll('[data-action="xlsxTab"]').forEach(function(b){ b.addEventListener("click", function(){ state.modal.sheetIdx=parseInt(b.getAttribute("data-i"),10); render(); }); });
  var dlPrev = document.querySelector('[data-action="downloadXlsxFromPreview"]');
  if(dlPrev) dlPrev.addEventListener("click", function(){
    var m = state.modal; dlPrev.disabled=true; dlPrev.textContent="ກຳລັງບັນທຶກ...";
    var bytes; try{ bytes = xlWorkbook(m.sheets); }catch(err){ toast("ບັນທຶກບໍ່ສຳເລັດ", true); dlPrev.disabled=false; dlPrev.textContent="ດາວໂຫຼດ Excel (.xlsx)"; return; }
    var fname = m.from+"_"+(m.dept==="all"?"AllDepts":"Dept")+"_LeaveSummary_to"+m.to+"_v1.xlsx";
    window.claude.use("downloads").then(function(dl){
      if(!dl){ toast("ບໍ່ສາມາດດາວໂຫຼດໃນໜ້ານີ້", true); dlPrev.disabled=false; dlPrev.textContent="ດາວໂຫຼດ Excel (.xlsx)"; return; }
      dl.save({filename:fname, data:bytes}).then(function(){ toast("ບັນທຶກໄຟລ໌ແລ້ວ: "+fname); state.modal=null; render(); }, function(e){ if(!e||e.code!=="declined") toast("ບັນທຶກບໍ່ສຳເລັດ", true); dlPrev.disabled=false; dlPrev.textContent="ດາວໂຫຼດ Excel (.xlsx)"; });
    });
  });
  bindPinModals();
  document.querySelectorAll('[data-action="goNotif"]').forEach(function(b){ b.addEventListener("click", function(){ var t=b.getAttribute("data-tab"); state.modal=null; if(t) state.view=t; render(); }); });
  var delBtn = document.querySelector('[data-action="confirmDelEmp"]');
  if(delBtn) delBtn.addEventListener("click", function(){
    var did=delBtn.getAttribute("data-id");
    state.db.collection("employees").doc(did).delete().then(function(){
      if(pinDoc(did)) state.db.collection("pins").doc(did).delete();
      state.modal=null; toast("ລຶບແລ້ວ"); render();
    });
  });
  var saveEmp = document.querySelector('[data-action="saveEmp"]');
  if(saveEmp) saveEmp.addEventListener("click", function(){
    var id = saveEmp.getAttribute("data-id");
    var newRole = document.getElementById("ee_role").value;
    var deptId = document.getElementById("ee_dept").value;
    var d = deptById(deptId);
    var fnVal = document.getElementById("ee_first").value.trim(), lnVal = document.getElementById("ee_last").value.trim();
    if(!fnVal || !lnVal){ toast("ກະລຸນາໃສ່ຊື່ ແລະ ຊື່ຫຼິ້ນໃຫ້ຄົບ", true); return; }
    state.db.collection("employees").doc(id).update({
      firstName: fnVal,
      lastName: lnVal,
      department: deptId,
      departmentName: d? d.name : "",
      position: document.getElementById("ee_pos").value.trim(),
      role: newRole,
      quotaAnnual: parseFloat(document.getElementById("ee_quota").value)||0,
      company: document.getElementById("ee_company").value,
      quotaSick: document.getElementById("ee_sick").value==="" ? null : parseFloat(document.getElementById("ee_sick").value),
      birthDate: document.getElementById("ee_bday").value || null,
      hireDate: document.getElementById("ee_hired").value || null,
      carryOver: Math.max(0, parseFloat(document.getElementById("ee_carry").value)||0),
      carryYear: new Date().getFullYear()
    }).then(function(){
      var pd=pinDoc(id), need=pinLen({role:newRole});
      if(pd && pd.len!==need){
        state.db.collection("pins").doc(id).delete();
        toast("ບົດບາດປ່ຽນ: ລຶບລະຫັດເກົ່າແລ້ວ. ຕ້ອງຕັ້ງລະຫັດໃໝ່ "+need+" ຕົວ");
      }
      state.modal=null; render();
    });
  });
}

/* ---- Idea #4: gentle analytics helpers ---- */
function monthlyTrend(from, to, dept){
  var months = {};
  state.requests.filter(function(r){
    return (r.status==="approved") && overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept);
  }).forEach(function(r){
    var a = r.dateFrom>from? r.dateFrom:from, b = r.dateTo<to? r.dateTo:to;
    var d = isoToDate(a);
    var key = d.getFullYear()+"-"+pad(d.getMonth()+1);
    months[key] = (months[key]||0) + Math.min(r.daysCount||0, daysInclusive(a,b));
  });
  return Object.keys(months).sort().map(function(k){ return {month:k, days:months[k]}; });
}
function mondayFridayPattern(from, to, dept){
  var byEmp = {};
  state.requests.filter(function(r){
    return r.status==="approved" && overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept);
  }).forEach(function(r){
    var d = isoToDate(r.dateFrom), wd = d.getDay();
    if(wd===1 || wd===5){
      byEmp[r.employeeId] = byEmp[r.employeeId] || {name:r.employeeName, mon:0, fri:0};
      if(wd===1) byEmp[r.employeeId].mon++; else byEmp[r.employeeId].fri++;
    }
  });
  return Object.keys(byEmp).map(function(k){ return byEmp[k]; }).filter(function(x){ return (x.mon+x.fri)>=3; }).sort(function(a,b){ return (b.mon+b.fri)-(a.mon+a.fri); });
}
function leaveLeaderboard(from, to, dept, n){
  var byEmp = {};
  state.employees.filter(function(e){ return dept==="all"||e.department===dept; }).forEach(function(e){ byEmp[e.id]={name:e.firstName+" "+e.lastName, absent:0}; });
  state.requests.filter(function(r){
    return r.status==="rejected" && r.absent && overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept) && byEmp[r.employeeId];
  }).forEach(function(r){ byEmp[r.employeeId].absent += 1; });
  return Object.keys(byEmp).map(function(k){ return byEmp[k]; }).sort(function(a,b){ return a.absent-b.absent; }).slice(0, n||5);
}

      lb.map(function(x,i){ return '<div class="leaderboard-row"><span>'+(i+1)+'. '+esc(shortName(x.name))+'</span><span class="faint">'+x.absent+' ຄັ້ງຂາດວຽກ</span></div>'; }).join("")+

function fireConfetti(){

  var wrap = document.createElement("div"); wrap.className="confetti-wrap";
  var colors=["#E0453A","#1F7BE0","#16705A","#E0A72A","#8A4FE0"];
  for(var i=0;i<26;i++){
    var p=document.createElement("span"); p.className="confetti-piece";
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.3)+"s";
    p.style.transform="rotate("+(Math.random()*360)+"deg)";

  }

function plannedAheadBadge(r){

var _lastBellCount = {};
function playSoftChime(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    if(!window._laoChimeCtx) window._laoChimeCtx = new AC();
    var ctx = window._laoChimeCtx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=740; g.gain.value=0.0001;
    o.connect(g); g.connect(ctx.destination);
    var t=ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.06, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.5);
    o.start(t); o.stop(t+0.55);
  }catch(e){}
}
function checkChime(emp){
  if(!(isHead(emp)||isHR(emp)||isDirector(emp))) return;
  var n = unreadCount(emp);
  var last = _lastBellCount[emp.id];
  if(last!==undefined && n>last) playSoftChime();
  _lastBellCount[emp.id] = n;
}

function donutSlices(byType, total){
  var palette=["#10C79B","#2AAEF5","#8A7BFF","#FF8A7A","#FFC24B"];
  var acc=0, out=[];
  LEAVE_TYPES.forEach(function(t,i){
    var v=byType[t.id]||0; if(!v) return;
    var pct = total>0? v/total*100 : 0;
    out.push({name:t.name, pct:pct, color:palette[i%palette.length]});
    acc+=pct;
  });
  return out;
}
function dashSpark(seed){
  var pts=[]; for(var i=0;i<8;i++){ pts.push(30 + ((seed*(i+3)*17)%40)); }
  var mx=Math.max.apply(null,pts);
  var poly = pts.map(function(v,i){ return (i/(pts.length-1)*80)+","+(28-(v/mx*24)); }).join(" ");
  return '<svg viewBox="0 0 80 28" class="spark"><polyline points="'+poly+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/></svg>';
}
function dashboardPanel(from, to, dept){
  var approved = state.requests.filter(function(r){
    return (r.status==="approved") && overlap(from,to,r.dateFrom,r.dateTo) && (dept==="all"||r.department===dept);
  });
  var totalDays = 0, byType={}; LEAVE_TYPES.forEach(function(t){ byType[t.id]=0; });
  approved.forEach(function(r){
    var a=r.dateFrom>from?r.dateFrom:from, b=r.dateTo<to?r.dateTo:to;
    var d = Math.min(r.daysCount||0, daysInclusive(a,b));
    totalDays += d; byType[r.leaveType]=(byType[r.leaveType]||0)+d;
  });
  var empCount = uniqCount(approved.map(function(r){return r.employeeId;}));
  var pendCount = state.requests.filter(function(r){ return (r.status==="pending_head"||r.status==="pending_hr") && (dept==="all"||r.department===dept); }).length;
  var approvalRate = (approved.length+pendCount)>0 ? Math.round(approved.length/(approved.length+pendCount)*100) : 100;

  var trend = monthlyTrend(from, to, dept);
  var vals = trend.map(function(x){return x.days;}); if(!vals.length) vals=[0,0];
  var maxV = Math.max.apply(null, vals.concat([0.0001]));
  var W=600, H=140, n=vals.length;
  var pts = vals.map(function(v,i){ var x = n>1 ? (i/(n-1))*W : 0; var y = H - (v/maxV)*(H-20) - 6; return {x:x,y:y}; });
  var line = pts.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  var area = (line||"M0,"+H) + " L"+W+","+H+" L0,"+H+" Z";
  var dots = pts.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.5" fill="#fff" stroke="#2AAEF5" stroke-width="2"/>'; }).join("");
  var xlabels = trend.map(function(x){ return x.month.slice(5); });

  var tiles = [
    {n:approved.length+pendCount, l:"ຄຳຮ້ອງທັງໝົດ", c:"#2AAEF5", s:1},
    {n:approved.length, l:"ອະນຸມັດແລ້ວ ("+approvalRate+"%)", c:"#10C79B", s:2},
    {n:pendCount, l:"ລໍຖ້າອະນຸມັດ", c:"#FFC24B", s:3},
    {n:empCount, l:"ພະນັກງານທີ່ລາ", c:"#8A7BFF", s:4}
  ];
  var tilesHtml = tiles.map(function(t){
    return '<div class="dash-tile"><div class="dash-tile-n" style="color:'+t.c+'">'+t.n+'</div><div class="dash-tile-l">'+t.l+'</div><div style="color:'+t.c+'">'+dashSpark(t.s)+'</div></div>';
  }).join("");

  var slices = donutSlices(byType, totalDays);
  var gradParts=[], acc=0;
  slices.forEach(function(s){ gradParts.push(s.color+" "+acc.toFixed(1)+"% "+(acc+s.pct).toFixed(1)+"%"); acc+=s.pct; });
  var donutCss = gradParts.length? gradParts.join(",") : "rgba(255,255,255,.12) 0% 100%";
  var legend = slices.length ? slices.map(function(s){ return '<div class="dash-legend-row"><span class="dash-dot" style="background:'+s.color+'"></span>'+esc(s.name)+'<span class="faint" style="margin-left:auto;color:rgba(234,242,255,.5)">'+s.pct.toFixed(0)+'%</span></div>'; }).join("") : '<div class="faint" style="color:rgba(234,242,255,.5)">ບໍ່ມີຂໍ້ມູນ</div>';

  return '<div class="dash-panel">'+
    '<div class="dash-tiles">'+tilesHtml+'</div>'+
    '<div class="dash-grid">'+
      '<div class="dash-card"><div class="dash-card-h">ແນວໂນ້ມການລາ (ມື້/ເດືອນ)</div>'+
        '<svg viewBox="0 0 '+W+' '+H+'" class="dash-chart" preserveAspectRatio="none">'+
          '<defs><linearGradient id="dashGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2AAEF5" stop-opacity=".55"/><stop offset="100%" stop-color="#2AAEF5" stop-opacity="0"/></linearGradient></defs>'+
          '<path d="'+area+'" fill="url(#dashGrad)"/>'+
          '<path d="'+line+'" fill="none" stroke="#2AAEF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px rgba(42,174,245,.65))"/>'+
          dots+
        '</svg>'+
        '<div class="dash-xlabels">'+xlabels.map(function(x){return '<span>'+x+'</span>';}).join("")+'</div>'+
      '</div>'+
      '<div class="dash-card dash-donut-card"><div class="dash-card-h">ແຍກຕາມປະເພດການລາ</div>'+
        '<div class="dash-donut" style="background:conic-gradient('+donutCss+')"><div class="dash-donut-hole">'+totalDays.toFixed(0)+'<small>ມື້</small></div></div>'+
        '<div class="dash-legend">'+legend+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ===== Living "neural network" background — slow, light, pauses when hidden ===== */
(function(){
  var cv=document.getElementById("netCanvas"); if(!cv || !cv.getContext) return;
  var ctx=cv.getContext("2d"), nodes=[], W=0, H=0, dpr=1, rgb="22,112,90", alpha=.2, last=0, raf=0;
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function readColors(){
    var cs=getComputedStyle(document.documentElement);
    rgb=(cs.getPropertyValue("--net-line")||"22,112,90").trim(); alpha=parseFloat(cs.getPropertyValue("--net-alpha"))||.2;
  }
  function size(){
    dpr=Math.min(window.devicePixelRatio||1, 2); W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.max(22, Math.min(80, Math.round(W*H/15000)));
    nodes=[]; for(var i=0;i<n;i++) nodes.push({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.22, vy:(Math.random()-.5)*.22, r:1+Math.random()*1.8, p:Math.random()*6.28});
    draw(0);
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    var maxD = Math.min(150, Math.max(90, W/6)), i, j, a, b, dx, dy, d;
    for(i=0;i<nodes.length;i++){
      a=nodes[i];
      for(j=i+1;j<nodes.length;j++){
        b=nodes[j]; dx=a.x-b.x; dy=a.y-b.y; d=Math.sqrt(dx*dx+dy*dy);
        if(d<maxD){ ctx.strokeStyle="rgba("+rgb+","+(alpha*(1-d/maxD)).toFixed(3)+")"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    }
    for(i=0;i<nodes.length;i++){
      a=nodes[i]; var pulse = .55+.45*Math.sin(a.p + t/900);
      ctx.fillStyle="rgba("+rgb+","+Math.min(1,alpha*3*pulse).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r+pulse*.8,0,6.283); ctx.fill();
    }
  }
  function step(t){
    raf=requestAnimationFrame(step);
    if(t-last<40) return;   // ~25 fps is plenty and kind to old phones
    last=t;
    for(var i=0;i<nodes.length;i++){ var n=nodes[i]; n.x+=n.vx; n.y+=n.vy;
      if(n.x<-20) n.x=W+20; if(n.x>W+20) n.x=-20; if(n.y<-20) n.y=H+20; if(n.y>H+20) n.y=-20; }
    draw(t);
  }
  function start(){ if(!still && !raf && !document.hidden) raf=requestAnimationFrame(step); }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
  readColors(); size(); start();
  var rt; window.addEventListener("resize", function(){ clearTimeout(rt); rt=setTimeout(size,200); });
  document.addEventListener("visibilitychange", function(){ document.hidden? stop() : start(); });
  if(window.matchMedia){ var mq=window.matchMedia("(prefers-color-scheme: dark)"); var f=function(){ readColors(); draw(last); }; if(mq.addEventListener) mq.addEventListener("change",f); else if(mq.addListener) mq.addListener(f); }
  if(window.MutationObserver) new MutationObserver(function(){ readColors(); draw(last); }).observe(document.documentElement,{attributes:true, attributeFilter:["data-theme"]});
})();

function tr(s){
  if(LANG==="lo" || !s || !LAO.test(s)) return s;
  var list=table[LANG], out=s, t=out.trim();
  for(var i=0;i<list.length && LAO.test(out);i++){
    var k=list[i][0], v=list[i][1];
    if(k.length<=2){ if(t===k){ out=out.replace(k,v); } continue; }
    var from=0, idx;
    while((idx=out.indexOf(k,from))>=0){
      var before=out.charAt(idx-1), after=out.charAt(idx+k.length);
      if(!LAOCH(before) && !LAOCH(after)){ out=out.slice(0,idx)+v+out.slice(idx+k.length); from=idx+v.length; }
      else from=idx+k.length;
    }
  }
  if(LANG==="en") out=out.replace(/\b1 days\b/g,"1 day").replace(/\b1 digits\b/g,"1 digit");
  return out;
}
window.I18N_tr=tr;
var ATTRS=["placeholder","title","aria-label","alt"];
function walk(root){
  if(LANG==="lo" || !root) return;
  if(root.nodeType===3){ if(LAO.test(root.nodeValue)){ var n=tr(root.nodeValue); if(n!==root.nodeValue) root.nodeValue=n; } return; }
  if(root.nodeType!==1) return;
  var tag=root.tagName; if(tag==="SCRIPT"||tag==="STYLE"||tag==="TEXTAREA") return;
  var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT, null, false), n;
  var els=[root];
  while((n=w.nextNode())){
    if(n.nodeType===3){ if(LAO.test(n.nodeValue)){ var p=n.parentNode; if(p && (p.tagName==="TEXTAREA"||p.tagName==="SCRIPT"||p.tagName==="STYLE")) continue; var v=tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; } }
    else els.push(n);
  }
  els.forEach(function(el){ ATTRS.forEach(function(a){ var val=el.getAttribute && el.getAttribute(a); if(val && LAO.test(val)){ var nv=tr(val); if(nv!==val) el.setAttribute(a,nv); } });
    if(el.tagName==="OPTION" && el.textContent && LAO.test(el.textContent)){ /* handled as text node */ } });
}
var obs=null;
function startObs(){
  if(!window.MutationObserver || obs) return;
  obs=new MutationObserver(function(muts){
    if(LANG==="lo") return;
    obs.disconnect();
    try{ muts.forEach(function(m){
      if(m.type==="childList"){ m.addedNodes.forEach(function(nd){ walk(nd); }); }
      else if(m.type==="characterData"){ walk(m.target); }
      else if(m.type==="attributes"){ var val=m.target.getAttribute(m.attributeName); if(val && LAO.test(val)) m.target.setAttribute(m.attributeName, tr(val)); }
    }); }catch(e){}
    obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});
  });
  obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});
}
var TITLES={lo:"ຂະໜົມລາວ ລາພັກ", en:"Khanom Lao Leave", zh:"ຂະໜົມລາວ 请假系统"};
function applyTheme(){
  var h=document.documentElement;
  if(THEME==="light"||THEME==="dark") h.setAttribute("data-theme",THEME); else h.removeAttribute("data-theme");
  var dark = THEME==="dark" || (THEME==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var meta=document.querySelector('meta[name="theme-color"]'); if(!meta){ meta=document.createElement("meta"); meta.name="theme-color"; document.head.appendChild(meta); }
  meta.content = dark ? "#0A1310" : "#E6F1FF";
  paintPrefs();
}
function applyLang(rerender){
  document.documentElement.setAttribute("lang", LANG==="zh"?"zh":(LANG==="en"?"en":"lo"));
  document.title=TITLES[LANG];
  if(rerender){ try{ if(typeof window.APP_RENDER==="function") window.APP_RENDER(); }catch(e){ console.log("lang render err", e && e.message); } }
  if(LANG!=="lo") walk(document.body);
  paintPrefs();
}
var box=null;
var LANG_ICO='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/></svg>';
var LANG_ABBR={lo:"ລາວ",en:"EN",zh:"中文"};
function paintPrefs(){
  if(!box) return;
  var dark = THEME==="dark" || (THEME==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var sun='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var moon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  var nm={lo:{l:"ໂໝດແຈ້ງ",d:"ໂໝດມືດ"},en:{l:"Light mode",d:"Dark mode"},zh:{l:"浅色模式",d:"深色模式"}}[LANG];
  var tb=box.querySelector("[data-pref=theme]"); tb.innerHTML=dark?sun:moon; tb.title=dark?nm.l:nm.d; tb.setAttribute("aria-label",tb.title);
  [].forEach.call(box.querySelectorAll("[data-lang]"),function(b){ b.classList.toggle("on", b.getAttribute("data-lang")===LANG); });
  var lt=box.querySelector(".lang-toggle"); if(lt){ var cur=lt.querySelector(".lang-cur"); if(cur) cur.textContent=LANG_ABBR[LANG]||LANG; }
}
function build(){
  box=document.createElement("div"); box.className="prefs-bar"; box.setAttribute("role","group");
  box.innerHTML='<button type="button" class="lang-toggle" data-pref="langToggle" aria-label="ປ່ຽນພາສາ" title="ປ່ຽນພາສາ">'+LANG_ICO+'<span class="lang-cur"></span></button>'+
    '<span class="lang-opts"><button type="button" data-lang="lo">ລາວ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></span>'+
    '<button type="button" class="theme" data-pref="theme"></button>';
  document.body.appendChild(box);
  box.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.getAttribute("data-pref")==="langToggle"){ box.classList.toggle("lang-open"); return; }
    var l=b.getAttribute("data-lang");
    if(l){ LANG=l; try{ localStorage.setItem("laophak_lang",l); }catch(x){} applyLang(true); box.classList.remove("lang-open"); }
    else if(b.getAttribute("data-pref")==="theme"){
      var dark = THEME==="dark" || (THEME==="auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      THEME = dark ? "light" : "dark"; try{ localStorage.setItem("laophak_theme",THEME); }catch(x){}
      applyTheme();
    }
  });
  document.addEventListener("click",function(e){ if(box && box.classList.contains("lang-open") && !box.contains(e.target)) box.classList.remove("lang-open"); });
  applyTheme(); applyLang(false); startObs();
}


// hide the floating language/theme bar while a pop-up sheet is open (it would cover the buttons)
(function(){
  if(!window.MutationObserver) return;
  var t=0, upd=function(){ t=0; document.body.classList.toggle("has-modal", !!document.querySelector(".modal-backdrop")); };
  new MutationObserver(function(){ if(!t) t=setTimeout(upd,0); }).observe(document.body,{childList:true,subtree:true});
})();
// safety net: if the app has not appeared after 15 s (slow network, blocked script, old browser) show a help box with the reason
(function(){
  var firstErr="";
  window.addEventListener("error",function(e){ if(!firstErr) firstErr=(e&&e.message)||"error"; });
  window.addEventListener("unhandledrejection",function(e){ if(!firstErr) firstErr=String((e&&e.reason&&(e.reason.message||e.reason.code))||"promise error"); });
  setTimeout(function(){
    if(document.querySelector(".login-shell,.tabs,.pin-card,.nort")) return;
    var d=document.createElement("div"); d.id="slowHelp";
    d.style.cssText="position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#fff;color:#14241B;border:2px solid #B33F35;border-radius:16px;padding:14px;font:14px/1.5 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)";
    d.innerHTML='<b>ຂະໜົມລາວ ລາພັກ · Khanom Lao Leave</b><br>ໂຫຼດຊ້າ ຫຼື ເປີດບໍ່ໄດ້ / Slow or cannot open / 加载缓慢或无法打开<br><small>1) ກວດອິນເຕີເນັດ / Check internet / 检查网络 · 2) ປິດ ແລ້ວເປີດໃໝ່ / Reload / 重新加载<br>'+(firstErr?('<span style="color:#B33F35">'+String(firstErr).replace(/</g,"&lt;").slice(0,160)+'</span><br>'):'')+'</small><button type="button" style="margin-top:8px;padding:10px 16px;border:none;border-radius:12px;background:#16705A;color:#fff;font-weight:700" onclick="location.reload()">Reload / ໂຫຼດໃໝ່ / 重新加载</button>';
    document.body.appendChild(d);
    var iv=setInterval(function(){ if(document.querySelector(".login-shell,.tabs,.pin-card")){ clearInterval(iv); if(d.parentNode) d.parentNode.removeChild(d); } },1000);
  },15000);
})();
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",build); else build();
// apply the saved theme as early as possible
try{ if(THEME==="light"||THEME==="dark") document.documentElement.setAttribute("data-theme",THEME); }catch(e){}
})();
</script>
